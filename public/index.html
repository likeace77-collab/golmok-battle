<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>정보쌤 브롤</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1430; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #3b2a7a, #120c24); z-index: 10; }
  .card { width: min(92vw, 380px); background: #23194a; border: 3px solid #000; border-radius: 18px; padding: 26px 22px; box-shadow: 0 8px 0 #000; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: -1px; color: #ffd84a; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000; }
  .sub { margin: 0 0 18px; opacity: .8; font-size: 14px; }
  label { display: block; text-align: left; font-size: 13px; margin: 10px 0 4px; opacity: .85; }
  input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 2px solid #000; background: #fff; color: #111; outline: none; }
  .btn { margin-top: 18px; width: 100%; padding: 14px; font-size: 20px; font-weight: 800; border: 3px solid #000; border-radius: 12px; background: #ffd84a; color: #111; box-shadow: 0 5px 0 #000; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  .help { margin-top: 16px; font-size: 12.5px; line-height: 1.6; opacity: .8; text-align: left; }
  .help b { color: #ffd84a; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 5; display: none; gap: 6px; }
  #hud button { padding: 7px 10px; font-size: 13px; font-weight: 700; border: 2px solid #000; border-radius: 8px; background: #fff; cursor: pointer; }
  #touch { display: none; }
  .tbtn { position: fixed; z-index: 6; border-radius: 50%; border: 3px solid #000; font-weight: 800; color: #111; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 1.1; }
  #tAtk { right: 28px; bottom: 34px; width: 92px; height: 92px; background: #ffd84a; font-size: 15px; }
  #tG1 { right: 132px; bottom: 30px; width: 62px; height: 62px; background: #7ee0ff; }
  #tG2 { right: 40px; bottom: 140px; width: 62px; height: 62px; background: #9cff9c; }
</style>
</head>
<body>
<div id="lobby">
  <div class="card">
    <h1>정보쌤 브롤</h1>
    <p class="sub">아~ 이놈의 아이들</p>
    <label>닉네임</label>
    <input id="nameIn" maxlength="10" placeholder="정보쌤">
    <label>방 코드 (친구랑 같은 코드 입력)</label>
    <input id="roomIn" maxlength="16" placeholder="lobby">
    <button class="btn" id="startBtn">입장</button>
    <div class="help">
      <b>이동</b> WASD / 방향키<br>
      <b>기본공격</b> Space / 클릭 — 아~ 이놈의 아이들 (주변 광역, 탄 3개)<br>
      <b>가젯1</b> Q — AI야? 시키지도 않은 걸 하네 (주변 스턴)<br>
      <b>가젯2</b> E — 마우스 소환 (적 쫓아가서 클릭딸깍)<br>
      가젯은 판당 각 3회, 공용 쿨타임 6초
    </div>
  </div>
</div>
<div id="hud"><button id="botBtn">+ 봇 추가</button><button id="clearBtn">봇 삭제</button></div>
<div id="touch">
  <div class="tbtn" id="tAtk">공격</div>
  <div class="tbtn" id="tG1">AI<br>스턴</div>
  <div class="tbtn" id="tG2">마우스<br>소환</div>
</div>
<canvas id="cv"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR, zoom;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  zoom = Math.min(W / 1000, H / 700) * 1.05;
  if (zoom < 0.5) zoom = 0.5;
}
addEventListener('resize', resize); resize();

const isTouch = 'ontouchstart' in window;
let socket, myId, MAP, ST;
let state = { players: [], mice: [] };
const view = {};        // id -> {x,y} 보간용
const mview = {};
const fxList = [];       // {type,x,y,r,t,dur,...}
const feed = [];         // 킬피드
const keys = {};

document.getElementById('nameIn').value = localStorage.getItem('jb_name') || '';
document.getElementById('roomIn').value = new URLSearchParams(location.search).get('room') || localStorage.getItem('jb_room') || '';

document.getElementById('startBtn').onclick = () => {
  const name = document.getElementById('nameIn').value.trim() || '정보쌤';
  const room = document.getElementById('roomIn').value.trim() || 'lobby';
  try { localStorage.setItem('jb_name', name); localStorage.setItem('jb_room', room); } catch (e) {}
  socket = io();
  socket.on('joined', (d) => {
    myId = d.id; MAP = d.map; ST = d.stats;
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    if (isTouch) document.getElementById('touch').style.display = 'block';
  });
  socket.on('state', (s) => {
    state = s;
    for (const f of s.fx) {
      if (f.type === 'kill') { feed.push({ text: `${f.a} ➜ ${f.b}`, t: 4 }); if (feed.length > 5) feed.shift(); }
      else fxList.push({ ...f, t: 0, dur: f.type === 'dmg' ? 0.8 : f.type === 'stun' ? 0.5 : 0.35 });
    }
  });
  socket.on('disconnect', () => { feed.push({ text: '서버 연결 끊김 — 새로고침 해주세요', t: 999 }); });
  socket.emit('join', { name, room });
};

document.getElementById('botBtn').onclick = (e) => { e.target.blur(); socket && socket.emit('addBot'); };
document.getElementById('clearBtn').onclick = (e) => { e.target.blur(); socket && socket.emit('clearBots'); };

// ── 입력 ───────────────────────────────────────────
addEventListener('keydown', (e) => {
  if (!socket || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (keys[k]) return;
  keys[k] = true;
  if (k === ' ') { socket.emit('attack'); e.preventDefault(); }
  if (k === 'q' || k === 'ㅂ') socket.emit('gadget', 1);
  if (k === 'e' || k === 'ㄷ') socket.emit('gadget', 2);
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousedown', () => { if (socket && !isTouch) socket.emit('attack'); });

// 터치 조이스틱
const joy = { id: null, sx: 0, sy: 0, x: 0, y: 0 };
cv.addEventListener('touchstart', (e) => {
  for (const t of e.changedTouches) {
    if (joy.id === null && t.clientX < W * 0.55) { joy.id = t.identifier; joy.sx = joy.x = t.clientX; joy.sy = joy.y = t.clientY; }
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
  e.preventDefault();
}, { passive: false });
const endJoy = (e) => { for (const t of e.changedTouches) if (t.identifier === joy.id) joy.id = null; };
cv.addEventListener('touchend', endJoy); cv.addEventListener('touchcancel', endJoy);
const tap = (id, fn) => document.getElementById(id).addEventListener('touchstart', (e) => { e.preventDefault(); socket && fn(); }, { passive: false });
tap('tAtk', () => socket.emit('attack'));
tap('tG1', () => socket.emit('gadget', 1));
tap('tG2', () => socket.emit('gadget', 2));

let lastSent = '';
setInterval(() => {
  if (!socket || !myId) return;
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft'] || keys['ㅁ']) mx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['ㅇ']) mx += 1;
  if (keys['w'] || keys['arrowup'] || keys['ㅈ']) my -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['ㄴ']) my += 1;
  if (joy.id !== null) {
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy);
    if (d > 8) { const m = Math.min(1, d / 60); mx = dx / d * m; my = dy / d * m; }
  }
  const key = mx.toFixed(2) + ',' + my.toFixed(2);
  if (key !== lastSent) { socket.emit('input', { mx, my }); lastSent = key; }
}, 1000 / 30);

// ── 그리기 ─────────────────────────────────────────
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawTeacher(p, x, y) {
  const r = ST.radius;
  ctx.save(); ctx.translate(x, y);
  if (p.dead) ctx.globalAlpha = 0.25;
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, r * 0.85, r * 0.9, r * 0.35, 0, 0, 7); ctx.fill();
  // 몸통 (팀 색 자켓)
  ctx.fillStyle = p.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  roundRect(-r * 0.75, -r * 0.1, r * 1.5, r * 0.95, 10); ctx.fill(); ctx.stroke();
  // 사원증 줄
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(0, 14); ctx.lineTo(8, 0); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-5, 13, 10, 8);
  // 얼굴
  ctx.fillStyle = '#ffd9b0'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -r * 0.55, r * 0.62, 0, 7); ctx.fill(); ctx.stroke();
  // 머리
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(0, -r * 0.68, r * 0.62, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  // 안경
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-7, -r * 0.52, 6, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(7, -r * 0.52, 6, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, -r * 0.52); ctx.lineTo(1, -r * 0.52); ctx.stroke();
  ctx.fillStyle = '#000'; ctx.fillRect(-8, -r * 0.54, 2, 3); ctx.fillRect(6, -r * 0.54, 2, 3);
  // 입
  ctx.beginPath(); ctx.moveTo(-5, -r * 0.3); ctx.lineTo(5, -r * 0.3); ctx.stroke();
  // 스턴 별
  if (p.stun && !p.dead) {
    const t = performance.now() / 200;
    ctx.fillStyle = '#ffe23a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) { const a = t + i * 2.1; ctx.fillText('★', Math.cos(a) * 22, -r * 1.25 + Math.sin(a) * 6); }
  }
  ctx.restore();
}

function drawMouse(m, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(m.a + Math.PI / 2);
  // 선 (꼬리)
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
  const w = Math.sin(performance.now() / 80) * 6;
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.quadraticCurveTo(w, 26, -w, 38); ctx.stroke();
  // 몸통
  ctx.fillStyle = '#e9e9ef'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 16, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, -3); ctx.moveTo(-11, -3); ctx.lineTo(11, -3); ctx.stroke();
  ctx.fillStyle = m.c; ctx.fillRect(-2, -12, 4, 6);
  ctx.restore();
  ctx.fillStyle = '#000'; ctx.fillRect(x - 14, y - 26, 28, 5);
  ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x - 13, y - 25, 26 * Math.max(0, m.hp), 3);
}

function bubble(text, x, y) {
  ctx.font = 'bold 14px sans-serif';
  const w = ctx.measureText(text).width + 16;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  roundRect(x - w / 2, y - 26, w, 24, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 5, y - 3); ctx.lineTo(x, y + 5); ctx.lineTo(x + 5, y - 3); ctx.fill();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.fillText(text, x, y - 9);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1b1430'; ctx.fillRect(0, 0, W, H);
  if (!MAP) { requestAnimationFrame(frame); return; }

  // 보간
  const k = Math.min(1, dt * 15);
  for (const p of state.players) {
    const v = view[p.id] || (view[p.id] = { x: p.x, y: p.y });
    if (Math.hypot(p.x - v.x, p.y - v.y) > 200) { v.x = p.x; v.y = p.y; }
    v.x += (p.x - v.x) * k; v.y += (p.y - v.y) * k;
  }
  for (const m of state.mice) {
    const v = mview[m.id] || (mview[m.id] = { x: m.x, y: m.y });
    v.x += (m.x - v.x) * k; v.y += (m.y - v.y) * k;
  }
  const me = state.players.find((p) => p.id === myId);
  const cam = me && view[me.id] ? view[me.id] : { x: MAP.w / 2, y: MAP.h / 2 };

  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-cam.x, -cam.y);

  // 바닥 (교실 타일)
  ctx.fillStyle = '#c99a63'; ctx.fillRect(0, 0, MAP.w, MAP.h);
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2;
  for (let x = 0; x <= MAP.w; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP.h); ctx.stroke(); }
  for (let y = 0; y <= MAP.h; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP.w, y); ctx.stroke(); }
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, MAP.w, MAP.h);

  // 벽 (책상)
  for (const w of MAP.walls) {
    ctx.fillStyle = '#5a3a22'; roundRect(w.x, w.y + 8, w.w, w.h, 8); ctx.fill();
    ctx.fillStyle = '#8b5a34'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    roundRect(w.x, w.y, w.w, w.h, 8); ctx.fill(); ctx.stroke();
  }

  // 이펙트 (바닥층)
  for (const f of fxList) {
    const t = f.t / f.dur;
    if (f.type === 'pulse') {
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = '#fff'; ctx.lineWidth = 10 * (1 - t) + 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + 0.6 * t), 0, 7); ctx.stroke();
      ctx.fillStyle = f.c; ctx.globalAlpha = 0.25 * (1 - t); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    } else if (f.type === 'stun') {
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = '#7ee0ff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * t, 0, 7); ctx.stroke();
      ctx.fillStyle = '#7ee0ff'; ctx.globalAlpha = 0.18 * (1 - t); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    } else if (f.type === 'summon') {
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = '#9cff9c'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, 60 * t, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  for (const m of state.mice) drawMouse(m, mview[m.id].x, mview[m.id].y);

  const sorted = [...state.players].sort((a, b) => view[a.id].y - view[b.id].y);
  for (const p of sorted) drawTeacher(p, view[p.id].x, view[p.id].y);

  // 이름, 체력바, 탄
  for (const p of sorted) {
    if (p.dead) continue;
    const { x, y } = view[p.id];
    const mine = p.id === myId;
    const bw = 64;
    ctx.fillStyle = '#000'; roundRect(x - bw / 2 - 2, y - 66, bw + 4, 12, 4); ctx.fill();
    ctx.fillStyle = mine ? '#3ccf7a' : '#ff4d4d';
    roundRect(x - bw / 2, y - 64, bw * (p.hp / ST.maxHp), 8, 3); ctx.fill();
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
    const label = `${p.name} ${p.hp}`;
    ctx.strokeText(label, x, y - 72); ctx.fillText(label, x, y - 72);
    if (mine) {
      for (let i = 0; i < ST.maxAmmo; i++) {
        const fill = Math.max(0, Math.min(1, p.ammo - i));
        const sx = x - 33 + i * 23;
        ctx.fillStyle = '#000'; ctx.fillRect(sx, y + 34, 20, 7);
        ctx.fillStyle = fill >= 1 ? '#ffb02e' : '#7a5a2a'; ctx.fillRect(sx + 1, y + 35, 18 * fill, 5);
      }
    }
    if (p.say) bubble(p.say, x, y - 82);
  }

  // 데미지 숫자
  for (const f of fxList) {
    if (f.type !== 'dmg' && f.type !== 'click') continue;
    const t = f.t / f.dur;
    ctx.globalAlpha = 1 - t; ctx.textAlign = 'center';
    if (f.type === 'dmg') {
      ctx.font = 'bold 18px sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
      ctx.strokeText(f.v, f.x, f.y - t * 30); ctx.fillText(f.v, f.x, f.y - t * 30);
    } else {
      ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#9cff9c'; ctx.fillText('딸깍!', f.x + 18, f.y - 20 - t * 20);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  for (let i = fxList.length - 1; i >= 0; i--) { fxList[i].t += dt; if (fxList[i].t > fxList[i].dur) fxList.splice(i, 1); }

  // ── 화면 UI ──
  // 점수판
  const board = [...state.players].sort((a, b) => b.k - a.k || a.d - b.d);
  ctx.textAlign = 'right'; ctx.font = 'bold 14px sans-serif';
  board.forEach((p, i) => {
    const txt = `${p.name}  ${p.k}킬 ${p.d}데스`;
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = p.id === myId ? '#ffd84a' : '#fff';
    ctx.strokeText(txt, W - 12, 24 + i * 20); ctx.fillText(txt, W - 12, 24 + i * 20);
  });
  // 킬피드
  ctx.textAlign = 'center';
  for (let i = feed.length - 1; i >= 0; i--) { feed[i].t -= dt; if (feed[i].t <= 0) feed.splice(i, 1); }
  feed.forEach((f, i) => {
    ctx.font = 'bold 15px sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = '#ff9a9a';
    ctx.strokeText(f.text, W / 2, 26 + i * 22); ctx.fillText(f.text, W / 2, 26 + i * 22);
  });

  if (me) {
    // 가젯 상태
    if (!isTouch) {
      const items = [['Q', 'AI야? 스턴', me.g1, '#7ee0ff'], ['E', '마우스 소환', me.g2, '#9cff9c']];
      items.forEach(([key, name, uses, col], i) => {
        const x = 16 + i * 150, y = H - 70;
        ctx.globalAlpha = uses > 0 && me.gCd <= 0 ? 1 : 0.45;
        ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        roundRect(x, y, 140, 54, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#111'; ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`[${key}] ${name}`, x + 10, y + 22);
        ctx.font = '13px sans-serif';
        ctx.fillText(me.gCd > 0 ? `쿨타임 ${me.gCd.toFixed(1)}초` : `남은 횟수 ${uses}`, x + 10, y + 42);
        ctx.globalAlpha = 1;
      });
    } else {
      const g1 = document.getElementById('tG1'), g2 = document.getElementById('tG2');
      g1.style.opacity = me.g1 > 0 && me.gCd <= 0 ? 1 : 0.4;
      g2.style.opacity = me.g2 > 0 && me.gCd <= 0 ? 1 : 0.4;
      g1.innerHTML = `AI<br>스턴<br>${me.g1}`; g2.innerHTML = `마우스<br>소환<br>${me.g2}`;
    }
    if (me.dead) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.font = 'bold 34px sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(`${me.respawn}초 후 부활`, W / 2, H / 2);
    }
  }

  // 조이스틱 표시
  if (joy.id !== null) {
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 60, 0, 7); ctx.stroke();
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy), m = Math.min(d, 60);
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.arc(joy.sx + (d ? dx / d * m : 0), joy.sy + (d ? dy / d * m : 0), 24, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
