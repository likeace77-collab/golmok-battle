<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>정보쌤 브롤</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f4f; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }
  .stroke { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 3px 0 #000; }
  input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 3px solid #000; background: #fff; color: #111; outline: none; }
  .btn { padding: 12px 18px; font-size: 20px; font-weight: 900; border: 4px solid #000; border-radius: 14px; background: linear-gradient(#ffe36b, #ffbf1f); color: #111; box-shadow: 0 6px 0 #000; cursor: pointer; font-family: inherit; }
  .btn:active, .pbtn:active, .lb:active, .bcard:active { transform: translateY(3px); }
  .btn.gray { background: linear-gradient(#e6e6ef, #b9b9cc); }

  /* ── 로비 ── */
  #lobbyBg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 30%, #ffd9f2 0%, #e48bff 30%, #7a3bc7 62%, #2c1458 100%); overflow: hidden; }
  #lobbyBg .sun { position: absolute; left: 50%; top: 46%; width: 54vmin; height: 54vmin; margin: -27vmin; border-radius: 50%; background: radial-gradient(circle, #fff8c4, #ffd45a 55%, rgba(255,190,70,0) 71%); }
  #lobbyBg .floor { position: absolute; left: -10%; right: -10%; bottom: -12%; height: 42%; border-radius: 50% 50% 0 0; background: linear-gradient(#5a3fb0, #24154f 70%); box-shadow: 0 -6px 0 rgba(255,255,255,.12) inset; }
  #lobbyBg .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255,255,255,.07) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lobby { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #lobby > * { pointer-events: auto; }
  .panel { background: linear-gradient(#45478a, #2b2c58); border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; }
  #profile { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; cursor: pointer; }
  #profile .av { width: 46px; height: 46px; border-radius: 9px; border: 3px solid #000; background: linear-gradient(#ffe36b, #ffb31f); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  #profile .pn { font-weight: 900; font-size: 16px; }
  #profile .tr { font-weight: 900; font-size: 15px; color: #ffd84a; }
  #lbtns { position: absolute; left: 10px; top: 80px; display: flex; flex-direction: column; gap: 10px; }
  .lb { width: 74px; padding: 6px 0 5px; text-align: center; font-weight: 900; font-size: 13px; cursor: pointer; }
  .lb .ic { font-size: 30px; line-height: 1.1; display: block; }
  #showName { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); text-align: center; white-space: nowrap; pointer-events: none; }
  .rbadge { text-shadow: none; display: inline-block; padding: 3px 12px; border-radius: 8px; border: 3px solid #000; font-weight: 900; font-size: 13px; color: #111; box-shadow: 0 3px 0 #000; }
  #showName .nm2 { font-size: 34px; font-weight: 900; margin-top: 6px; }
  #showName .tt { font-size: 14px; font-weight: 800; opacity: .9; margin-top: 2px; }
  #playWrap { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: stretch; }
  #modeBox { padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 150px; }
  #modeBox b { font-size: 17px; color: #ffd84a; }
  #modeBox span { font-size: 12px; opacity: .85; margin-top: 2px; }
  .pbtn { min-width: 170px; font-size: 32px; font-weight: 900; border: 4px solid #000; border-radius: 14px; background: linear-gradient(#fff07a, #ffc21f 60%, #f0a400); color: #111; box-shadow: 0 6px 0 #000; cursor: pointer; font-family: inherit; padding: 10px 26px; }
  @media (orientation: portrait) {
    #playWrap { left: 12px; flex-direction: column; }
    .pbtn { font-size: 30px; padding: 14px; }
    #showName { top: 13%; }
  }
  #status { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); font-weight: 900; font-size: 18px; pointer-events: none; }

  /* ── 브롤러 선택 ── */
  #bscreen { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; background: radial-gradient(circle at 50% 0%, #4a3aa8, #1a1238 70%); }
  #bscreen header { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .back { width: 48px; height: 42px; font-size: 22px; font-weight: 900; border: 3px solid #000; border-radius: 10px; background: linear-gradient(#ffe36b, #ffb31f); box-shadow: 0 4px 0 #000; cursor: pointer; }
  #bscreen h2 { margin: 0; font-size: 26px; font-weight: 900; }
  #bscreen .cnt { margin-left: auto; font-weight: 900; opacity: .85; }
  #bgrid { flex: 1; overflow-y: auto; padding: 8px 14px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; align-content: start; touch-action: pan-y; }
  .bcard { position: relative; height: 158px; border: 3px solid #000; border-radius: 12px; box-shadow: 0 5px 0 #000; overflow: hidden; cursor: pointer; }
  .bcard img { position: absolute; left: 0; right: 0; top: 4px; margin: auto; height: 118px; }
  .bcard .bn { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 0 5px; background: rgba(0,0,0,.55); text-align: center; font-weight: 900; font-size: 15px; }
  .bcard .rr { position: absolute; left: 6px; top: 5px; font-size: 11px; font-weight: 900; color: #111; background: rgba(255,255,255,.7); padding: 1px 6px; border-radius: 6px; }
  .bcard .wipb { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-weight: 900; font-size: 12px; background: rgba(0,0,0,.6); padding: 3px 0; }
  .bcard.sel { outline: 4px solid #fff; outline-offset: -8px; }
  .bcard .ck { position: absolute; right: 6px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #3ce07f; border: 3px solid #000; color: #000; font-weight: 900; display: none; align-items: center; justify-content: center; font-size: 15px; }
  .bcard.sel .ck { display: flex; }
  .bcard.locked { background: repeating-linear-gradient(45deg, #3a3a52, #3a3a52 10px, #34344a 10px, #34344a 20px); cursor: default; }
  .bcard.locked .q { position: absolute; inset: 0 0 30px; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 900; opacity: .35; }
  #bdetail { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(10,6,30,.75); }
  #bdetail .box { width: min(94vw, 760px); max-height: 92vh; overflow-y: auto; display: flex; gap: 14px; padding: 14px; }
  #bdetail .pic { flex: 0 0 210px; border: 3px solid #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  #bdetail .pic img { width: 200px; }
  #bdetail .info { flex: 1; min-width: 0; }
  #bdetail .dn { font-size: 30px; font-weight: 900; margin: 6px 0 0; }
  #bdetail .dq { color: #ffd84a; font-weight: 800; margin: 2px 0 6px; }
  #bdetail .dd { font-size: 13px; opacity: .9; line-height: 1.5; }
  #bdetail .stats { display: flex; gap: 8px; margin: 8px 0; }
  #bdetail .stats div { background: rgba(0,0,0,.35); border-radius: 8px; padding: 4px 10px; font-weight: 900; font-size: 13px; }
  .sk { display: flex; gap: 10px; align-items: flex-start; background: rgba(0,0,0,.3); border-radius: 10px; padding: 7px 9px; margin-top: 6px; }
  .sk .si { flex: 0 0 38px; height: 38px; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .sk .st { font-size: 11px; font-weight: 900; opacity: .7; }
  .sk .sn { font-weight: 900; font-size: 15px; }
  .sk .sd { font-size: 12px; opacity: .85; line-height: 1.4; }
  #bdetail .acts { display: flex; gap: 10px; margin-top: 12px; }
  @media (orientation: portrait) { #bdetail .box { flex-direction: column; } #bdetail .pic { flex: 0 0 auto; height: 180px; } #bdetail .pic img { width: 170px; } }
  /* 모드 선택 */
  #modeBox { cursor: pointer; }
  #modeBox small { font-size: 11px; color: #ffd84a; margin-top: 3px; }
  #mscreen { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; background: radial-gradient(circle at 50% 0%, #3a5aa8, #121a38 70%); }
  #mscreen header { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  #mscreen h2 { margin: 0; font-size: 26px; font-weight: 900; }
  #mgrid { flex: 1; overflow-y: auto; padding: 8px 14px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-content: start; touch-action: pan-y; }
  .mcard { position: relative; border: 3px solid #000; border-radius: 14px; box-shadow: 0 5px 0 #000; padding: 12px 14px; cursor: pointer; min-height: 120px; }
  .mcard .mi { font-size: 38px; }
  .mcard .mn { font-size: 22px; font-weight: 900; }
  .mcard .md { font-size: 12.5px; line-height: 1.45; margin-top: 4px; background: rgba(0,0,0,.35); border-radius: 8px; padding: 5px 8px; }
  .mcard .mm { font-size: 11px; margin-top: 6px; opacity: .9; font-weight: 800; }
  .mcard.sel { outline: 4px solid #fff; outline-offset: -9px; }
  /* 로드아웃 */
  #sLoad { margin-top: 6px; display: flex; gap: 5px; justify-content: center; }
  #sLoad span { width: 30px; height: 30px; border-radius: 8px; border: 2px solid #000; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; background: rgba(0,0,0,.4); }
  .sec { font-size: 13px; font-weight: 900; color: #ffd84a; margin: 10px 0 2px; }
  .sk.pickable { cursor: pointer; border: 3px solid transparent; }
  .sk.pickable.on { border-color: #3ce07f; background: rgba(60,224,127,.18); }
  .sk.pickable .ok { margin-left: auto; font-weight: 900; color: #3ce07f; display: none; }
  .sk.pickable.on .ok { display: block; }
  .gears { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .gear { border: 3px solid transparent; background: rgba(0,0,0,.3); border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; }
  .gear b { display: block; font-size: 12px; } .gear i { font-style: normal; font-size: 22px; } .gear small { display: block; font-size: 10px; opacity: .8; line-height: 1.3; }
  .gear.on { border-color: #3ce07f; background: rgba(60,224,127,.18); }
  /* 게임 HUD */
  #modeHud { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; font-weight: 900; font-size: 16px; text-align: center; white-space: nowrap; pointer-events: none; }
  #modeHud .gs { display: inline-flex; gap: 10px; align-items: center; background: rgba(0,0,0,.45); padding: 3px 12px; border-radius: 10px; font-size: 20px; }
  #phaseMsg { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 9; font-size: 54px; font-weight: 900; text-align: center; display: none; pointer-events: none; }
  #phaseMsg small { display: block; font-size: 18px; margin-top: 6px; }
  .lbl .rfb { width: 74px; height: 7px; margin: 2px auto 0; background: #000; border-radius: 4px; padding: 1px; display: none; }
  .lbl .rfb i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #b56cff, #ff3a8a); }
  .lbl.ally .hpb i { background: #4f8cff; }
  .lbl .fb { width: 74px; height: 7px; margin: 2px auto 0; background: #000; border-radius: 4px; padding: 1px; display: none; position: relative; }
  .lbl .fb i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffe36b, #4f8cff); }
  .lbl .fb.scared i { background: #8fd3ff; animation: blink .3s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }
  /* 로그인 */
  #auth { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #e48bff 0%, #7a3bc7 45%, #2c1458 100%); }
  #auth .box { width: min(92vw, 380px); padding: 22px 20px; text-align: center; }
  #auth h1 { margin: 0; font-size: 40px; font-weight: 900; color: #ffd84a; letter-spacing: -1px; }
  #auth .tabs { display: flex; gap: 6px; margin: 16px 0 10px; }
  #auth .tabs button { flex: 1; padding: 9px; font-size: 16px; font-weight: 900; border: 3px solid #000; border-radius: 10px; background: #3a3b6e; color: #fff; cursor: pointer; font-family: inherit; }
  #auth .tabs button.on { background: linear-gradient(#ffe36b, #ffbf1f); color: #111; }
  #auth input { margin-top: 8px; }
  #auth .err { color: #ff8a8a; font-weight: 800; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #auth .go { width: 100%; margin-top: 6px; }
  #auth .guest { margin-top: 12px; font-size: 13px; opacity: .85; text-decoration: underline; cursor: pointer; }
  #onlineBtn { position: absolute; top: 10px; right: 12px; padding: 6px 12px; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #onlineBtn i { width: 11px; height: 11px; border-radius: 50%; background: #3ce07f; box-shadow: 0 0 8px #3ce07f; }
  #olist { max-height: 55vh; overflow-y: auto; text-align: left; margin-top: 6px; touch-action: pan-y; }
  #olist .or { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; background: rgba(0,0,0,.28); margin-top: 5px; }
  #olist .or b { font-size: 15px; } #olist .or .st { margin-left: auto; font-size: 12px; font-weight: 800; text-align: right; }
  #olist .or .tr { font-size: 12px; color: #ffd84a; font-weight: 900; }
  #trPop { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 12; font-size: 30px; font-weight: 900; color: #ffd84a; pointer-events: none; opacity: 0; transition: opacity .3s, top .8s; }
  #modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(10,6,30,.7); }
  #modal .box { width: min(90vw, 340px); padding: 18px; text-align: center; }
  #modal h3 { margin: 0 0 12px; font-size: 20px; }
  #modal .acts { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #help { font-size: 13px; line-height: 1.7; text-align: left; }
  #help b { color: #ffd84a; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
  .nm { font-weight: 900; font-size: 14px; }
  .hpb { width: 74px; height: 12px; margin: 2px auto 0; background: #000; border-radius: 5px; padding: 2px; }
  .hpb i { display: block; height: 100%; border-radius: 3px; background: #ff4d4d; transition: width .1s; }
  .me .hpb i { background: #3ce07f; }
  .am { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
  .am i { width: 22px; height: 7px; background: #000; border-radius: 3px; overflow: hidden; position: relative; }
  .am i b { position: absolute; left: 0; top: 0; bottom: 0; background: #ffb02e; }
  .bub { display: none; margin: 0 auto 6px; background: #fff; color: #111; border: 3px solid #000; border-radius: 12px; padding: 4px 10px; font-weight: 900; font-size: 14px; position: relative; animation: pop .18s ease-out; }
  .bub:after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-top-color: #000; border-bottom: 0; }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .pp { position: absolute; transform: translate(-50%, -50%); font-weight: 900; white-space: nowrap; }

  #top { position: fixed; top: 8px; left: 8px; z-index: 8; display: none; gap: 6px; pointer-events: auto; }   /* 버튼이 항상 맨 위 */
  #top button { padding: 7px 10px; font-size: 13px; font-weight: 800; border: 3px solid #000; border-radius: 9px; background: #fff; cursor: pointer; }
  #board { position: fixed; top: 8px; right: 12px; z-index: 6; text-align: right; font-weight: 800; font-size: 14px; line-height: 1.5; pointer-events: none; }
  #feed { pointer-events: none; }
  /* 세로 폰 화면: 버튼 줄 → 그 아래 모드 정보 → 그 아래 점수판·킬피드 */
  @media (max-width: 720px) {
    #top button { padding: 6px 9px; font-size: 12px; }
    #modeHud { top: 50px; font-size: 13px; }
    #modeHud .gs { font-size: 15px; padding: 2px 10px; }
    #modeHud .gs[style] { font-size: 12px !important; }
    #board { top: 86px; right: 8px; font-size: 11px; line-height: 1.35; }
    #feed { top: 150px; font-size: 13px; }
  }
  #feed { position: fixed; top: 100px; left: 0; right: 0; z-index: 6; text-align: center; font-weight: 900; font-size: 15px; color: #ff9a9a; line-height: 1.6; }
  #dead { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); font-size: 36px; font-weight: 900; }

  #ctrl { position: fixed; right: 14px; bottom: 16px; z-index: 8; display: none; width: 160px; height: 160px; }
  .cb { position: absolute; border-radius: 50%; border: 3px solid #000; touch-action: none; font-weight: 900; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; box-shadow: 0 5px 0 #000; cursor: pointer; pointer-events: auto; }
  .cb small { font-size: 8px; opacity: .7; }
  .cb .gi { font-size: 22px; line-height: 1; }
  .cb.puppet { outline: 3px solid #ff8af0; outline-offset: 2px; }
  .cb .n { position: absolute; top: -6px; right: -6px; background: #000; color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 6px; }
  .cb .cd { position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: none; align-items: center; justify-content: center; font-size: 13px; }
  #bAtk { right: 0; bottom: 0; width: 80px; height: 80px; background: radial-gradient(circle at 40% 35%, #ffe98a, #ffb31f); font-size: 13px; }
  #bG1 { right: 94px; bottom: 2px; width: 52px; height: 52px; background: radial-gradient(circle at 40% 35%, #c9f6ff, #4fd2ff); font-size: 10px; }
  #bSup { right: 76px; bottom: 70px; width: 62px; height: 62px; font-size: 11px; color: #fff; background: #3a2a6a; }
  #bSup.ready { animation: glow .7s infinite alternate; color: #111; }
  @keyframes glow { from { box-shadow: 0 5px 0 #000, 0 0 10px 3px #ffb31f; } to { box-shadow: 0 5px 0 #000, 0 0 26px 10px #ff5a1f; } }
  #bG2 { right: 10px; bottom: 94px; width: 52px; height: 52px; background: radial-gradient(circle at 40% 35%, #d8ffd0, #63e65a); font-size: 10px; }
  #frost { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(ellipse at center, rgba(160,220,255,0) 45%, rgba(170,225,255,.55) 85%, rgba(230,250,255,.85)); }
  #ctrlMsg { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 7; display: none; font-size: 22px; font-weight: 900; color: #ff8af0; text-align: center; pointer-events: none; }
  #ctrlFlash { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 40px rgba(200,60,255,.55); transition: opacity .3s; }
  #lookFlash { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: rgba(255,140,200,.35); transition: opacity .5s; }
  #bSup.off { background: #555 !important; color: #ccc; animation: none; }
  #aimJoy { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border: 3px solid rgba(255,140,40,.8); background: rgba(255,120,30,.12); border-radius: 50%; display: none; z-index: 9; pointer-events: none; }
  #aimJoy.atk { border-color: rgba(255,220,80,.85); background: rgba(255,220,80,.12); }
  #aimJoy.atk i { background: rgba(255,225,100,.95); }
  #aimJoy.cancel { border-color: rgba(255,80,80,.9); background: rgba(255,40,40,.18); }
  #aimJoy b { position: absolute; left: 0; right: 0; top: -26px; text-align: center; font-size: 14px; color: #ff6b6b; display: none; }
  #aimJoy.cancel b { display: block; }
  #aimJoy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(255,170,60,.9); border: 3px solid #000; }
</style>

  <div id="onlineBtn" class="panel stroke"><i></i>온라인 <span id="oCnt">-</span>명</div>
  <div id="lbtns">
    <div class="lb panel stroke" id="openB"><span class="ic">🧑‍🏫</span>브롤러</div>

<script type="module">
import * as THREE from 'three';

const S = 0.05;                       // 서버 px → 3D 월드 단위
const isTouch = 'ontouchstart' in window;
const $ = (id) => document.getElementById(id);

// ── 렌더러 / 씬 ───────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1f4f');
scene.fog = new THREE.Fog('#2a1f4f', 70, 140);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

scene.add(new THREE.HemisphereLight('#ffffff', '#7a5aa8', 1.15));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 90 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

let W = 1, H = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  if (typeof lobbyCam !== 'undefined') { lobbyCam.aspect = W / H; lobbyCam.updateProjectionMatrix(); }
}
addEventListener('resize', resize); resize();

// ── 공용 재질 ─────────────────────────────────────
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
const basicCache = {};
const basic = (c) => basicCache[c] || (basicCache[c] = new THREE.MeshBasicMaterial({ color: c, transparent: true }));
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// ── 맵 (컴퓨터실) ─────────────────────────────────
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const floorTex = canvasTex(256, 256, (g, w, h) => {
  const cols = ['#d9dbe8', '#c9cde0'];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = cols[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
  g.strokeStyle = 'rgba(60,60,90,.35)'; g.lineWidth = 4;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
  for (let k = 0; k < 140; k++) { g.fillStyle = `rgba(80,80,120,${Math.random() * 0.12})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
const screenTex = canvasTex(128, 96, (g) => {
  g.fillStyle = '#0b1a3a'; g.fillRect(0, 0, 128, 96);
  const cs = ['#5ee0ff', '#ffd84a', '#ff7ac6', '#7dff8a', '#ffffff'];
  for (let y = 10; y < 90; y += 9) { let x = 8 + Math.floor(Math.random() * 3) * 8; while (x < 110 && Math.random() < 0.8) { const w = 8 + Math.random() * 26; g.fillStyle = cs[Math.floor(Math.random() * cs.length)]; g.fillRect(x, y, w, 4); x += w + 5; } }
});

// 맵 테마: 바닥 색, 외곽 벽, 장애물 모양
const THEMES = {
  computer:   { floor: ['#d9dbe8', '#c9cde0'], border: ['#7b5cff', '#5a3fd6'], bg: '#2a1f4f' },
  math:       { floor: ['#eadfc8', '#dccfb3'], border: ['#3d7a5a', '#2c5a42'], bg: '#1d3529' },
  cafeteria:  { floor: ['#fff4d6', '#f3dfa8'], border: ['#5fbf8a', '#3f9a6a'], bg: '#283d2c' },
  playground: { floor: ['#6cc24a', '#5fb540'], border: ['#a0703f', '#7a5230'], bg: '#2d4724', grass: true },
  gym:        { floor: ['#e2b06f', '#d6a25f'], border: ['#3a6fd8', '#2a54ad'], bg: '#1b2848', planks: true },
};
const floorCache = {};
function floorTexFor(theme) {
  if (floorCache[theme]) return floorCache[theme];
  const T = THEMES[theme] || THEMES.computer;
  const t = canvasTex(256, 256, (g, w, h) => {
    if (T.planks) {
      for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? T.floor[0] : T.floor[1]; g.fillRect(0, i * 32, w, 32); }
      g.strokeStyle = 'rgba(90,50,10,.35)'; g.lineWidth = 2;
      for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(0, i * 32); g.lineTo(w, i * 32); g.stroke(); const x = (i * 97) % w; g.beginPath(); g.moveTo(x, i * 32); g.lineTo(x, i * 32 + 32); g.stroke(); }
    } else if (T.grass) {
      g.fillStyle = T.floor[0]; g.fillRect(0, 0, w, h);
      for (let k = 0; k < 900; k++) { g.fillStyle = Math.random() < 0.5 ? T.floor[1] : '#7fd65a'; g.fillRect(Math.random() * w, Math.random() * h, 2, 5); }
    } else {
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = T.floor[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
      g.strokeStyle = 'rgba(60,60,90,.3)'; g.lineWidth = 4;
      for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
    }
    for (let k = 0; k < 140; k++) { g.fillStyle = `rgba(60,60,60,${Math.random() * 0.1})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return (floorCache[theme] = t);
}
const chalkTex = canvasTex(256, 128, (g) => {
  g.fillStyle = '#2f5d46'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = 'bold 22px sans-serif';
  const f = ['x²+y²=r²', 'π≈3.14', '∫ f(x)dx', 'a+b=c', 'sin²θ+cos²θ=1', '√2', 'y=ax+b', '2x-3=7'];
  for (let i = 0; i < 4; i++) g.fillText(f[Math.floor(Math.random() * f.length)], 10 + (i % 2) * 120, 32 + Math.floor(i / 2) * 50);
});
chalkTex.wrapS = THREE.RepeatWrapping;
let mapGroup = null, curMapId = null;
function buildMap(MAP) {
  if (mapGroup) scene.remove(mapGroup);
  mapGroup = new THREE.Group(); scene.add(mapGroup);
  const add = (...o) => mapGroup.add(...o);
  const T = THEMES[MAP.theme] || THEMES.computer;
  scene.background = new THREE.Color(T.bg); scene.fog.color.set(T.bg);
  const fw = MAP.w * S, fh = MAP.h * S;
  const ft = floorTexFor(MAP.theme); ft.repeat.set(fw / 6, fh / 6);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), std('#ffffff', { map: ft, roughness: 0.6 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(fw / 2, 0, fh / 2); floor.receiveShadow = true; add(floor);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(fw + 200, fh + 200), std(T.bg));
  outer.rotation.x = -Math.PI / 2; outer.position.set(fw / 2, -0.02, fh / 2); outer.receiveShadow = true; add(outer);
  if (MAP.theme === 'gym') {   // 코트 라인
    const lm = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7 });
    const c = new THREE.Mesh(new THREE.RingGeometry(5.6, 5.9, 48), lm); c.rotation.x = -Math.PI / 2; c.position.set(fw / 2, 0.02, fh / 2); add(c);
    const l = new THREE.Mesh(new THREE.PlaneGeometry(fw, 0.3), lm); l.rotation.x = -Math.PI / 2; l.position.set(fw / 2, 0.02, fh / 2); add(l);
  }
  // 외곽 벽
  const bm = std(T.border[0], { roughness: 0.5 }), bm2 = std(T.border[1]);
  const TH = 1.2, HH = 1.3;
  for (const [x, z, w, d] of [[fw / 2, -TH / 2, fw + 2 * TH, TH], [fw / 2, fh + TH / 2, fw + 2 * TH, TH], [-TH / 2, fh / 2, TH, fh], [fw + TH / 2, fh / 2, TH, fh]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, HH, d), bm); b.position.set(x, HH / 2, z);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.2, d + 0.1), bm2); cap.position.set(x, HH + 0.1, z);
    shadowAll(b); shadowAll(cap); add(b, cap);
  }
  for (const w of MAP.walls) {
    const g = new THREE.Group(); g.position.set((w.x + w.w / 2) * S, 0, (w.y + w.h / 2) * S);
    OBST[MAP.theme] ? OBST[MAP.theme](g, w.w * S, w.h * S) : OBST.computer(g, w.w * S, w.h * S);
    shadowAll(g); add(g);
  }
  // 젬 광산
  if (MAP.mine) {
    const m = new THREE.Group(); m.position.set(MAP.mine.x * S, 0, MAP.mine.y * S);
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4, 0), std('#5a4a6a', { roughness: 0.9 })); rock.scale.y = 0.45; rock.position.y = 0.3; m.add(rock);
    for (let i = 0; i < 6; i++) { const c = new THREE.Mesh(new THREE.OctahedronGeometry(0.35), std('#c070ff', { emissive: '#7a20c0', emissiveIntensity: 0.6, roughness: 0.2 })); const a = i * 1.05; c.position.set(Math.cos(a) * 0.8, 0.7, Math.sin(a) * 0.8); c.rotation.z = Math.cos(a) * 0.5; c.scale.y = 1.6; m.add(c); }
    shadowAll(m); add(m);
  }
  curMapId = MAP.id;
}
// 테마별 장애물
const OBST = {
  computer(g, sw, sd) {
    const wood = std('#b07a46', { roughness: 0.55 }), woodD = std('#7a4e2b'), dark = std('#222630', { roughness: 0.4 }), key = std('#e9e9ef');
    const scr = new THREE.MeshBasicMaterial({ map: screenTex });
    const body = new THREE.Mesh(new THREE.BoxGeometry(sw - 0.3, 1.25, sd - 0.3), woodD); body.position.y = 0.63;
    const top = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.22, sd), wood); top.position.y = 1.36;
    g.add(body, top);
    const along = sw >= sd, len = along ? sw : sd, n = Math.max(1, Math.floor(len / 2.6));
    for (let i = 0; i < n; i++) {
      const off = -len / 2 + len / n * (i + 0.5);
      const mon = new THREE.Group();
      const stand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), dark); stand.position.y = 1.7;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 0.12), dark); frame.position.y = 2.35;
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.86), scr); screen.position.set(0, 2.35, 0.065);
      const kb = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.06, 0.38), key); kb.position.set(0, 1.5, 0.55);
      mon.add(stand, frame, screen, kb);
      if (along) mon.position.x = off; else { mon.position.z = off; mon.rotation.y = Math.PI / 2; }
      g.add(mon);
    }
  },
  math(g, sw, sd) {        // 초록 칠판
    const frame = new THREE.Mesh(new THREE.BoxGeometry(sw, 2.3, sd), std('#8a5a2c', { roughness: 0.6 })); frame.position.y = 1.15;
    const board = new THREE.Mesh(new THREE.BoxGeometry(sw + 0.02, 1.8, sd + 0.02), std('#ffffff', { map: chalkTex, roughness: 0.9 })); board.position.y = 1.3;
    const tray = new THREE.Mesh(new THREE.BoxGeometry(sw + 0.2, 0.1, sd + 0.2), std('#6e4520')); tray.position.y = 0.35;
    g.add(frame, board, tray);
  },
  cafeteria(g, sw, sd) {   // 급식 테이블 + 식판
    const body = new THREE.Mesh(new THREE.BoxGeometry(sw - 0.2, 0.95, sd - 0.2), std('#bfc9d4', { metalness: 0.3, roughness: 0.4 })); body.position.y = 0.48;
    const top = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.16, sd), std('#f4f4f8', { roughness: 0.3 })); top.position.y = 1.03;
    g.add(body, top);
    const along = sw >= sd, len = along ? sw : sd, n = Math.max(1, Math.floor(len / 1.6));
    const foods = ['#ff7a3a', '#ffe36b', '#7dd65a', '#c9a27a'];
    for (let i = 0; i < n; i++) {
      const off = -len / 2 + len / n * (i + 0.5);
      const tray = new THREE.Group();
      const t = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 0.7), std('#d8dde3', { metalness: 0.6, roughness: 0.3 })); t.position.y = 1.14; tray.add(t);
      for (let k = 0; k < 3; k++) { const f = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), std(foods[(i + k) % 4])); f.position.set(-0.3 + k * 0.3, 1.2, 0); f.scale.y = 0.6; tray.add(f); }
      if (along) tray.position.x = off; else { tray.position.z = off; tray.rotation.y = Math.PI / 2; }
      g.add(tray);
    }
  },
  playground(g, sw, sd) {  // 덤불 + 벤치 느낌
    const hedge = new THREE.Mesh(new THREE.BoxGeometry(sw, 1.3, sd), std('#3f9a3a', { roughness: 1 })); hedge.position.y = 0.65; g.add(hedge);
    const n = Math.max(2, Math.round((sw * sd) / 1.2));
    for (let i = 0; i < Math.min(n, 30); i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.45 + Math.random() * 0.25, 10, 8), std(Math.random() < 0.5 ? '#4cb046' : '#3a8f35', { roughness: 1 })); b.position.set((Math.random() - 0.5) * sw * 0.9, 1.3 + Math.random() * 0.2, (Math.random() - 0.5) * sd * 0.9); g.add(b); }
  },
  gym(g, sw, sd) {         // 파란 매트 + 뜀틀
    const a = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.7, sd), std('#2f6fe0', { roughness: 0.7 })); a.position.y = 0.35;
    const b = new THREE.Mesh(new THREE.BoxGeometry(sw * 0.92, 0.7, sd * 0.92), std('#4a8af5', { roughness: 0.7 })); b.position.y = 1.05;
    const top = new THREE.Mesh(new THREE.BoxGeometry(sw * 0.85, 0.12, sd * 0.85), std('#f2f2f2')); top.position.y = 1.46;
    g.add(a, b, top);
  },
};

// ── 젬 / 독가스 / 칠판 파편 렌더 ──────────────────
const gemMeshes = {}, shardMeshes = {};
const gemGeo = new THREE.OctahedronGeometry(0.42);
const gemMat = std('#c070ff', { emissive: '#8a2be2', emissiveIntensity: 0.7, roughness: 0.15, metalness: 0.2 });
const gasGroup = new THREE.Group(); scene.add(gasGroup);
const gasMat = new THREE.MeshBasicMaterial({ color: '#a03cff', transparent: true, opacity: 0.45, depthWrite: false });   // 보라색 독가스 (잔디 위에서도 잘 보이게)
for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), gasMat); m.position.y = 1.5; gasGroup.add(m); }
function updateWorld(now) {
  const seen = new Set();
  for (const [id, x, y] of state.gems || []) {
    seen.add(String(id));
    let m = gemMeshes[id];
    if (!m) { m = gemMeshes[id] = new THREE.Mesh(gemGeo, gemMat); m.castShadow = true; m.position.set(x * S, 0.8, y * S); scene.add(m); }
    m.position.x += (x * S - m.position.x) * 0.3; m.position.z += (y * S - m.position.z) * 0.3;
    m.position.y = 0.8 + Math.sin(now * 3 + id) * 0.15; m.rotation.y = now * 2 + id; m.scale.y = 1.4;
  }
  for (const id in gemMeshes) if (!seen.has(id)) { scene.remove(gemMeshes[id]); delete gemMeshes[id]; }
  const sseen = new Set();
  for (const [id, x, y, r, t] of state.shards || []) {
    sseen.add(String(id));
    let g = shardMeshes[id];
    if (!g) {
      g = shardMeshes[id] = new THREE.Group(); g.position.set(x * S, 0, y * S);
      const red = new THREE.Mesh(new THREE.CircleGeometry(r * S, 32), new THREE.MeshBasicMaterial({ color: '#ff3a3a', transparent: true, opacity: 0.18, depthWrite: false }));
      red.rotation.x = -Math.PI / 2; red.position.y = 0.03; g.add(red); g.userData.red = red;
      for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2, d = Math.random() * r * S * 0.9;
        const sh = new THREE.Mesh(new THREE.BoxGeometry(0.25 + Math.random() * 0.4, 0.06, 0.2 + Math.random() * 0.3), std(i % 4 ? '#2f5d46' : '#8a5a2c'));
        sh.position.set(Math.cos(a) * d, 0.05, Math.sin(a) * d); sh.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * 3, 0); g.add(sh);
      }
      scene.add(g);
    }
    g.userData.red.material.opacity = 0.12 + Math.abs(Math.sin(now * 5)) * 0.15;
    g.visible = t > 0.3 || Math.sin(now * 30) > 0;
  }
  for (const id in shardMeshes) if (!sseen.has(id)) { scene.remove(shardMeshes[id]); delete shardMeshes[id]; }
  // 독가스: 안전지대 바깥 네 면
  const sf = state.safe;
  gasGroup.visible = !!sf && !!MAP;
  if (gasGroup.visible) {
    const W2 = MAP.w * S, H2 = MAP.h * S, x1 = sf.x1 * S, x2 = sf.x2 * S, y1 = sf.y1 * S, y2 = sf.y2 * S, P = 30;
    const set = (m, ax, az, bx, bz) => { const w = Math.max(0.01, bx - ax), d = Math.max(0.01, bz - az); m.scale.set(w, 1, d); m.position.x = (ax + bx) / 2; m.position.z = (az + bz) / 2; m.visible = w > 0.05 && d > 0.05; };
    const [a, b, c, d] = gasGroup.children;
    set(a, -P, -P, W2 + P, y1); set(b, -P, y2, W2 + P, H2 + P); set(c, -P, y1, x1, y2); set(d, x2, y1, W2 + P, y2);
    gasMat.opacity = 0.42 + Math.sin(now * 2) * 0.06;
  }
}

// ── 정보쌤 3D 모델 ────────────────────────────────
// 뚱뚱한 체형 · 뿔테안경 · 금목걸이 · 검은 티셔츠 · 검은 외투 · 하늘색 바지
function makeTeacher(teamColor) {
  const m = {
    skin: std('#f1c39c', { roughness: 0.6 }),
    shirt: std('#161616', { roughness: 0.95 }),
    coat: std('#0c0c10', { roughness: 0.38, metalness: 0.15, side: THREE.DoubleSide }),
    pants: std('#8fd3ff', { roughness: 0.8 }),
    shoe: std('#f4f4f4', { roughness: 0.5 }),
    sole: std('#222'),
    hair: std('#131313', { roughness: 0.8 }),
    frame: std('#2a150a', { roughness: 0.3 }),
    lens: new THREE.MeshStandardMaterial({ color: '#cdeaff', transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.3 }),
    gold: std('#ffcf3a', { metalness: 1, roughness: 0.2, emissive: '#6a4300', emissiveIntensity: 0.4 }),
    eye: std('#111'), mouth: std('#7a2a2a'),
  };
  const root = new THREE.Group();
  const model = new THREE.Group(); model.scale.setScalar(0.88); root.add(model);
  const body = new THREE.Group(); model.add(body);

  const ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 1.65, 48), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.9 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; root.add(ring);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(1.35, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; root.add(blob);

  // 다리 (하늘색 바지)
  const legs = [];
  for (const sx of [-0.45, 0.45]) {
    const hip = new THREE.Group(); hip.position.set(sx, 1.1, 0); body.add(hip);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.3, 1.0, 14), m.pants); leg.position.y = -0.5; hip.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.26, 0.72), m.shoe); shoe.position.set(0, -1.0, 0.1); hip.add(shoe);
    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.74), m.sole); sole.position.set(0, -1.12, 0.1); hip.add(sole);
    legs.push(hip);
  }
  // 몸통
  const torso = new THREE.Group(); torso.position.y = 1.0; body.add(torso);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), m.shirt);
  belly.scale.set(1.18, 1.08, 1.1); belly.position.set(0, 0.95, 0.08); torso.add(belly);
  const hipBand = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.9, 0.35, 24), m.pants); hipBand.position.y = 0.15; torso.add(hipBand);
  // 외투 (앞이 열린 검은 코트)
  const OPEN = 0.62;
  const coat = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.32, 1.9, 28, 1, true, OPEN, Math.PI * 2 - OPEN * 2), m.coat);
  coat.position.y = 0.95; torso.add(coat);
  const shoulders = new THREE.Mesh(new THREE.SphereGeometry(1.1, 28, 12, Math.PI / 2 + OPEN, Math.PI * 2 - OPEN * 2, 0, Math.PI / 2), m.coat);
  shoulders.scale.y = 0.5; shoulders.position.y = 1.9; torso.add(shoulders);
  for (const s of [-1, 1]) {
    const lapel = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.2, 0.08), m.coat);
    lapel.position.set(s * 0.62, 1.45, 0.98); lapel.rotation.set(-0.25, s * 0.55, s * 0.28); torso.add(lapel);
  }
  // 금목걸이 (두 줄 + 펜던트)
  const chain1 = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.07, 10, 40), m.gold);
  chain1.position.set(0, 1.78, 0.42); chain1.rotation.x = 1.15; torso.add(chain1);
  const chain2 = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.055, 10, 40), m.gold);
  chain2.position.set(0, 1.62, 0.5); chain2.rotation.x = 1.0; torso.add(chain2);
  const pend = new THREE.Mesh(new THREE.OctahedronGeometry(0.17), m.gold);
  pend.position.set(0, 1.12, 1.08); pend.scale.set(1, 1.3, 0.6); torso.add(pend);
  // 팔 (외투 소매)
  const arms = [];
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 1.15, 1.75, 0); torso.add(sh);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 1.1, 14), m.coat); sleeve.position.y = -0.55; sh.add(sleeve);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 10), m.skin); hand.position.y = -1.18; sh.add(hand);
    sh.rotation.z = s * 0.32; sh.userData.baseZ = s * 0.32;
    arms.push(sh);
  }
  // 머리
  const head = new THREE.Group(); head.position.y = 2.55; torso.add(head);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.72, 26, 20), m.skin); face.scale.set(1.08, 1, 1); head.add(face);
  const chin = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 14), m.skin); chin.position.set(0, -0.42, 0.2); chin.scale.set(1.25, 0.75, 1); head.add(chin);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.76, 26, 14, 0, Math.PI * 2, 0, Math.PI / 2.3), m.hair);
  hair.position.y = 0.06; hair.scale.set(1.08, 0.95, 1.05); hair.rotation.x = -0.25; head.add(hair);
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), m.skin); ear.position.set(s * 0.78, 0, -0.02); head.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), m.eye); eye.position.set(s * 0.27, 0.08, 0.66); head.add(eye);
    // 뿔테
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.065, 10, 26), m.frame); rim.position.set(s * 0.28, 0.08, 0.72); rim.scale.set(1.15, 0.9, 1); head.add(rim);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.19, 20), m.lens); lens.position.set(s * 0.28, 0.08, 0.73); lens.scale.set(1.15, 0.9, 1); head.add(lens);
    const temple = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.75), m.frame); temple.position.set(s * 0.72, 0.12, 0.38); temple.rotation.y = s * 0.12; head.add(temple);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 0.1), m.frame); brow.position.set(s * 0.28, 0.27, 0.74); head.add(brow);
  }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.06), m.frame); bridge.position.set(0, 0.12, 0.76); head.add(bridge);
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 6, 16, Math.PI), m.mouth); mouth.position.set(0, -0.2, 0.7); mouth.rotation.z = Math.PI; head.add(mouth);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), m.skin); nose.position.set(0, -0.04, 0.74); head.add(nose);

  // 스턴 별
  const stars = new THREE.Group(); stars.position.y = 4.4; model.add(stars); stars.visible = false;
  for (let i = 0; i < 4; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), new THREE.MeshBasicMaterial({ color: '#ffe23a' }));
    st.position.set(Math.cos(i * Math.PI / 2) * 0.9, 0, Math.sin(i * Math.PI / 2) * 0.9); stars.add(st);
  }
  shadowAll(model);
  ring.castShadow = blob.castShadow = false;
  return { root, model, body, torso, head, legs, arms, stars, flashMats: [m.skin, m.shirt, m.coat, m.pants] };
}

// ── 현실쌤 3D 모델 ────────────────────────────────
// 40~50대 여자 수학쌤 · 뽀글 파마 · 진한 화장 · 핑크색 옷 · 털가죽 잠바
function makeHyeonsil(teamColor) {
  const m = {
    skin: std('#e8b08c', { roughness: 0.65 }),
    pink: std('#ff6fae', { roughness: 0.8 }),
    pink2: std('#ff9fcb', { roughness: 0.85 }),
    leather: std('#5b3a22', { roughness: 0.32, metalness: 0.15, side: THREE.DoubleSide }),
    fur: std('#ead9bd', { roughness: 1 }),
    fur2: std('#cdb48f', { roughness: 1 }),
    hair: std('#4a2216', { roughness: 0.9 }),
    shoe: std('#7a1030', { roughness: 0.35 }),
    lip: std('#c4123a', { roughness: 0.3 }),
    eye: std('#111'), brow: std('#2a140c'), line: std('#c48a6c'),
    gold: std('#ffcf3a', { metalness: 1, roughness: 0.25 }),
    blush: std('#f07a7a', { roughness: 0.8 }),
  };
  const root = new THREE.Group();
  const model = new THREE.Group(); model.scale.setScalar(0.88); root.add(model);
  const body = new THREE.Group(); model.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 1.65, 48), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.9 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; root.add(ring);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(1.35, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; root.add(blob);
  // 털 뭉치 (작은 구 여러 개)
  const fluff = (parent, n, place, r0 = 0.16) => {
    for (let i = 0; i < n; i++) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(r0 * (0.75 + Math.random() * 0.5), 8, 6), i % 3 ? m.fur : m.fur2);
      place(b, i / n); parent.add(b);
    }
  };

  // 다리 (핑크 바지) + 굽 있는 구두
  const legs = [];
  for (const sx of [-0.4, 0.4]) {
    const hip = new THREE.Group(); hip.position.set(sx, 1.1, 0); body.add(hip);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.27, 1.0, 14), m.pink2); leg.position.y = -0.5; hip.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.66), m.shoe); shoe.position.set(0, -1.02, 0.1); hip.add(shoe);
    const heel = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.18, 0.14), m.shoe); heel.position.set(0, -1.15, -0.16); hip.add(heel);
    legs.push(hip);
  }
  // 몸통: 핑크 상의
  const torso = new THREE.Group(); torso.position.y = 1.0; body.add(torso);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1, 26, 18), m.pink); top.scale.set(1.0, 1.05, 0.92); top.position.y = 0.95; torso.add(top);
  const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.82, 0.32, 24), m.pink2); waist.position.y = 0.15; torso.add(waist);
  // 털가죽 잠바 (앞이 열린 가죽 + 털 칼라/밑단)
  const OPEN = 0.7;
  const jk = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.15, 1.6, 26, 1, true, OPEN, Math.PI * 2 - OPEN * 2), m.leather); jk.position.y = 1.05; torso.add(jk);
  const sh = new THREE.Mesh(new THREE.SphereGeometry(1.0, 26, 12, Math.PI / 2 + OPEN, Math.PI * 2 - OPEN * 2, 0, Math.PI / 2), m.leather); sh.scale.y = 0.5; sh.position.y = 1.85; torso.add(sh);
  // 털 칼라 (목 둘레 + 앞섶 따라)
  const J = (v) => (Math.random() - 0.5) * v;
  fluff(torso, 46, (b, t) => { const a = t * Math.PI * 2 + J(0.2); const rr = 0.86 + J(0.18); b.position.set(Math.sin(a) * rr, 1.84 + J(0.12), Math.cos(a) * rr * 0.82 - 0.08); }, 0.22);
  for (const s of [-1, 1]) fluff(torso, 10, (b, t) => { const a = s * (OPEN + 0.08) + J(0.12); b.position.set(Math.sin(a) * 1.08, 1.7 - t * 1.3 + J(0.1), Math.cos(a) * 1.02); }, 0.17);
  // 털 밑단
  fluff(torso, 30, (b, t) => { const a = OPEN + t * (Math.PI * 2 - OPEN * 2); b.position.set(Math.sin(a) * (1.17 + J(0.08)), 0.27 + J(0.12), Math.cos(a) * (1.17 + J(0.08))); }, 0.17);
  // 금 목걸이
  const neck = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.04, 8, 30), m.gold); neck.position.set(0, 1.75, 0.5); neck.rotation.x = 1.2; torso.add(neck);
  // 팔 (가죽 소매 + 털 소매끝)
  const arms = [];
  for (const s of [-1, 1]) {
    const shd = new THREE.Group(); shd.position.set(s * 1.05, 1.72, 0); torso.add(shd);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 1.05, 14), m.leather); sleeve.position.y = -0.52; shd.add(sleeve);
    fluff(shd, 14, (b, t) => { const a = t * Math.PI * 2; b.position.set(Math.sin(a) * 0.35, -1.0 + (Math.random() - 0.5) * 0.12, Math.cos(a) * 0.35); }, 0.15);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 10), m.skin); hand.position.y = -1.22; shd.add(hand);
    shd.rotation.z = s * 0.28; shd.userData.baseZ = s * 0.28;
    arms.push(shd);
    if (s === 1) {   // 큰 나무주걱
      // 사진처럼: 진한 적갈색 원목, 넓적한 날 + 비스듬한 윗면 + 손잡이 끝 구멍
      const sp = new THREE.Group(); sp.position.set(0.05, -1.2, 0.28); sp.rotation.set(0.42, 0, -0.32); shd.add(sp);
      const sh = new THREE.Shape();
      sh.moveTo(-0.1, 0); sh.quadraticCurveTo(0, -0.1, 0.1, 0);
      sh.lineTo(0.12, 0.95); sh.quadraticCurveTo(0.16, 1.12, 0.33, 1.3);
      sh.lineTo(0.4, 2.3); sh.quadraticCurveTo(0.4, 2.46, 0.26, 2.47);
      sh.lineTo(-0.3, 2.36); sh.quadraticCurveTo(-0.42, 2.34, -0.41, 2.22);
      sh.lineTo(-0.34, 1.32); sh.quadraticCurveTo(-0.17, 1.12, -0.12, 0.95);
      sh.lineTo(-0.1, 0);
      const hole = new THREE.Path(); hole.absarc(0, 0.13, 0.04, 0, Math.PI * 2, true); sh.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 12 });
      geo.translate(0, -0.45, -0.035);
      const grain = canvasTex(64, 256, (g, w, h) => {
        g.fillStyle = '#5a1c13'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(${Math.random() < 0.5 ? '30,5,2' : '140,60,40'},${0.15 + Math.random() * 0.25})`; g.lineWidth = 1 + Math.random() * 2; const x = Math.random() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 6, h * 0.3, x - 6, h * 0.6, x + 3, h); g.stroke(); }
      });
      const wood = new THREE.MeshPhysicalMaterial({ color: '#ffffff', map: grain, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.3 });
      const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 1.2 + 0.5, uv.getY(i) / 2.5);
      const spatula = new THREE.Mesh(geo, wood); spatula.scale.setScalar(1.15); sp.add(spatula);
    }
  }
  // 머리
  const head = new THREE.Group(); head.position.y = 2.88; torso.add(head);
  // 계란형 얼굴 (위가 넓고 턱이 갸름)
  const eggPts = [];
  for (let i = 0; i <= 24; i++) { const t = -1 + (i / 24) * 2, y = t * 0.86; eggPts.push(new THREE.Vector2(Math.max(0.001, 0.66 * Math.sqrt(1 - t * t) * (1 + 0.16 * t)), y)); }
  const face = new THREE.Mesh(new THREE.LatheGeometry(eggPts, 32), m.skin); face.position.y = -0.04; face.scale.z = 0.95; head.add(face);
  // 긴 생머리 (가르마 · 양옆으로 길게 내려옴)
  const hm = std('#2a1610', { roughness: 0.5, side: THREE.DoubleSide });
  // 정수리 볼륨 (위에도 머리숱 많게)
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.8, 30, 18, 0, Math.PI * 2, 0, Math.PI / 1.95), hm);
  cap.position.set(0, 0.14, -0.08); cap.scale.set(1.1, 1.22, 1.12); cap.rotation.x = -0.42; head.add(cap);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 14), hm); crown.position.set(0, 0.42, -0.2); crown.scale.set(1.08, 0.75, 1.0); head.add(crown);
  const back = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.3, 2.1, 30, 1, true, Math.PI * 0.38, Math.PI * 1.24), hm);
  back.position.set(0, -0.85, -0.05); head.add(back);
  for (const s of [-1, 1]) {
    // 얼굴 옆을 감싸고 어깨 앞으로 길게 내려오는 머리
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.25, 0.45), hm);
    upper.position.set(s * 0.74, -0.2, 0.0); upper.rotation.z = s * 0.05; head.add(upper);
    const lower = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.35, 0.14), hm);
    lower.position.set(s * 0.84, -1.3, 0.5); lower.rotation.set(-0.12, 0, s * 0.12); head.add(lower);
  }
  const part = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.45), std('#e8b08c')); part.position.set(0.08, 0.98, 0.18); part.rotation.x = -0.4; head.add(part);   // 가르마
  // 얼굴 (진한 화장 · 매서운 표정)
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 6), m.eye); eye.position.set(s * 0.24, 0.1, 0.63); eye.scale.set(1.3, 0.7, 1); head.add(eye);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.05), std('#7a3a8a')); lid.position.set(s * 0.24, 0.17, 0.64); head.add(lid);   // 보라 아이섀도
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, 0.05), m.brow); brow.position.set(s * 0.25, 0.3, 0.63); brow.rotation.z = s * 0.35; head.add(brow);   // 치켜 올라간 문신 눈썹
    const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.12, 14), m.blush); cheek.position.set(s * 0.38, -0.08, 0.6); cheek.rotation.y = s * 0.45; head.add(cheek);
    const nl = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.02), m.line); nl.position.set(s * 0.2, -0.17, 0.66); nl.rotation.z = s * 0.35; head.add(nl);   // 팔자주름
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), m.skin); ear.position.set(s * 0.68, 0, 0); head.add(ear);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.025, 6, 16), m.gold); ring2.position.set(s * 0.7, -0.18, 0.02); ring2.rotation.y = Math.PI / 2; head.add(ring2);
  }
  { const w = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.014, 0.02), m.line); w.position.set(0, 0.44, 0.56); head.add(w); }   // 이마 주름 살짝
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), m.skin); nose.position.set(0, -0.02, 0.7); nose.scale.set(1.1, 1, 1.15); head.add(nose);
  const lips = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.05, 8, 18), m.lip); lips.position.set(0, -0.28, 0.63); lips.scale.set(1.2, 0.45, 1); head.add(lips);   // 빨간 립스틱, 입꼬리 내려감

  const stars = new THREE.Group(); stars.position.y = 4.5; model.add(stars); stars.visible = false;
  for (let i = 0; i < 4; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), new THREE.MeshBasicMaterial({ color: '#ffe23a' }));
    st.position.set(Math.cos(i * Math.PI / 2) * 0.9, 0, Math.sin(i * Math.PI / 2) * 0.9); stars.add(st);
  }
  shadowAll(model);
  return { root, model, body, torso, head, legs, arms, stars, flashMats: [m.skin, m.pink, m.leather, m.pink2] };
}

// ── 김준후 3D 모델 ────────────────────────────────
// 작은 학생 · 네모 안경 · 삐죽 솟은 머리 · 교복(남색 마이 + 흰 셔츠 + 빨간 넥타이) · 비웃는 표정
function makeJunhoo(teamColor) {
  const m = {
    skin: std('#f3c9a4', { roughness: 0.6 }),
    blazer: std('#1f2a52', { roughness: 0.55, side: THREE.DoubleSide }),
    shirt: std('#f4f6fa', { roughness: 0.8 }),
    tie: std('#d8233a', { roughness: 0.5 }),
    pants: std('#4a4f5c', { roughness: 0.8 }),
    shoe: std('#ffffff', { roughness: 0.5 }), shoeR: std('#e8323a'),
    hair: std('#16120f', { roughness: 0.75 }),
    frame: std('#111', { roughness: 0.3 }),
    lens: new THREE.MeshStandardMaterial({ color: '#d9f0ff', transparent: true, opacity: 0.3, roughness: 0.05, metalness: 0.3 }),
    eye: std('#111'), mouth: std('#7a2a2a'), gold: std('#ffcf3a', { metalness: 0.9, roughness: 0.3 }),
  };
  const root = new THREE.Group();

    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.26, 0.7), m.shoe); shoe.position.set(0, -1.0, 0.1); hip.add(shoe);

    legs.push(hip);
  }
  // 몸통: 흰 셔츠 + 넥타이 + 남색 마이
  const torso = new THREE.Group(); torso.position.y = 1.0; body.add(torso);
  const shirt = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.58, 1.35, 20), m.shirt); shirt.position.y = 0.75; torso.add(shirt);
  const tie = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 0.05), m.tie); tie.position.set(0, 0.95, 0.6); tie.rotation.x = -0.05; torso.add(tie);
  const knot = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.08), m.tie); knot.position.set(0, 1.38, 0.6); torso.add(knot);
  const OPEN = 0.55;
  const blz = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.72, 1.45, 22, 1, true, OPEN, Math.PI * 2 - OPEN * 2), m.blazer); blz.position.y = 0.75; torso.add(blz);
  const sh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 22, 10, Math.PI / 2 + OPEN, Math.PI * 2 - OPEN * 2, 0, Math.PI / 2), m.blazer); sh.scale.y = 0.45; sh.position.y = 1.47; torso.add(sh);
  for (const s of [-1, 1]) {
    const lapel = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.05), m.blazer); lapel.position.set(s * 0.36, 1.2, 0.62); lapel.rotation.set(-0.2, s * 0.5, s * 0.3); torso.add(lapel);
  }
  const tag = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.03), m.shirt); tag.position.set(-0.4, 1.12, 0.6); tag.rotation.y = -0.45; torso.add(tag);   // 명찰
  const emb = new THREE.Mesh(new THREE.CircleGeometry(0.08, 12), m.gold); emb.position.set(0.42, 1.15, 0.6); emb.rotation.y = 0.5; torso.add(emb);       // 학교 마크
  // 팔
  const arms = [];
  for (const s of [-1, 1]) {
    const shd = new THREE.Group(); shd.position.set(s * 0.74, 1.4, 0); torso.add(shd);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.23, 1.0, 12), m.blazer); sleeve.position.y = -0.5; shd.add(sleeve);
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.08, 12), m.shirt); cuff.position.y = -1.0; shd.add(cuff);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), m.skin); hand.position.y = -1.13; shd.add(hand);
    shd.rotation.z = s * 0.22; shd.userData.baseZ = s * 0.22;
    arms.push(shd);
  }
  // 머리 (몸에 비해 큼 — 귀여운 비율)
  const head = new THREE.Group(); head.position.y = 2.25; torso.add(head);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.72, 26, 20), m.skin); face.scale.set(1, 1.02, 0.96); head.add(face);
  // 삐죽삐죽 나대는 머리
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.76, 26, 14, 0, Math.PI * 2, 0, Math.PI / 2.3), m.hair); cap.position.set(0, 0.06, -0.04); cap.rotation.x = -0.25; head.add(cap);
  const spikes = [[0, 0.78, 0.15, -0.5], [0.3, 0.72, 0.05, -0.2], [-0.3, 0.72, 0.05, -0.2], [0.15, 0.8, -0.25, 0.3], [-0.15, 0.8, -0.25, 0.3], [0.48, 0.55, -0.2, 0.1], [-0.48, 0.55, -0.2, 0.1], [0, 0.62, -0.5, 0.7], [0.2, 0.6, 0.42, -0.9]];
  for (const [x, y, z, rx] of spikes) {
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.55, 6), m.hair);
    sp.position.set(x, y, z); sp.rotation.set(rx, 0, -x * 0.9); head.add(sp);
  }
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), m.skin); ear.position.set(s * 0.72, -0.02, 0); head.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), m.eye); eye.position.set(s * 0.25, 0.06, 0.66); eye.scale.y = s === 1 ? 0.55 : 1; head.add(eye);   // 한쪽 눈 가늘게 (비웃음)
    // 네모 뿔테 안경
    const fr = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.035, 6, 4), m.frame); fr.rotation.z = Math.PI / 4; fr.scale.set(1.25, 0.9, 1); fr.position.set(s * 0.26, 0.06, 0.71); head.add(fr);
    const ln = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.22), m.lens); ln.position.set(s * 0.26, 0.06, 0.72); head.add(ln);
    const tm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.68), m.frame); tm.position.set(s * 0.68, 0.1, 0.36); head.add(tm);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.05), m.hair); brow.position.set(s * 0.26, s === 1 ? 0.3 : 0.26, 0.68); brow.rotation.z = s === 1 ? -0.35 : 0.15; head.add(brow);   // 한쪽 눈썹 치켜올림
  }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.04, 0.04), m.frame); bridge.position.set(0, 0.1, 0.74); head.add(bridge);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), m.skin); nose.position.set(0, -0.06, 0.72); head.add(nose);
  // 씨익 비웃는 입 (한쪽만 올라감)
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 6, 16, Math.PI * 0.8), m.mouth); mouth.position.set(0.05, -0.28, 0.66); mouth.rotation.set(0, 0, Math.PI * 1.15); head.add(mouth);
  const plaster = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.07, 0.02), std('#f0c890')); plaster.position.set(-0.36, -0.12, 0.6); plaster.rotation.set(0, -0.5, 0.4); head.add(plaster);   // 볼에 반창고

  const stars = new THREE.Group(); stars.position.y = 3.7; model.add(stars); stars.visible = false;
  for (let i = 0; i < 4; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), new THREE.MeshBasicMaterial({ color: '#ffe23a' }));
    st.position.set(Math.cos(i * Math.PI / 2) * 0.8, 0, Math.sin(i * Math.PI / 2) * 0.8); stars.add(st);
  }
  shadowAll(model);
  return { root, model, body, torso, head, legs, arms, stars, flashMats: [m.skin, m.blazer, m.shirt, m.pants] };
}

// ── 김재열 3D 모델 ────────────────────────────────
// 큰 대가리 · 두꺼운 뿔테안경(한쪽 반사광) · 길게 넘긴 가오 머리 · 반창고
// 가오 포즈: 턱 치켜들고 내려다보기, 몸 뒤로 젖힘, 두 손 주머니, 마이는 어깨에만 걸침, 풍선껌
function makeJaeyeol(teamColor) {
  const m = {
    skin: std('#f1c6a0', { roughness: 0.6 }),
    shirt: std('#f6f7fb', { roughness: 0.8 }),
    blazer: std('#15161c', { roughness: 0.45, metalness: 0.1, side: THREE.DoubleSide }),
    tie: std('#1f3fa8', { roughness: 0.5 }),
    pants: std('#22242c', { roughness: 0.75 }),
    shoe: std('#111', { roughness: 0.35 }), sole: std('#f2f2f2'),

    frame: std('#3a1d10', { roughness: 0.25 }),
    lens: new THREE.MeshStandardMaterial({ color: '#d9f0ff', transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.3 }),
    glare: new THREE.MeshBasicMaterial({ color: '#ffffff' }),
    eye: std('#111'), mouth: std('#7a2a2a'), gum: std('#ff8ac6', { roughness: 0.25, transparent: true, opacity: 0.92 }),
    band: std('#f0c890'),
  };
  const root = new THREE.Group();
  const model = new THREE.Group(); model.scale.setScalar(0.8); root.add(model);
  const body = new THREE.Group(); model.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 1.65, 48), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.9 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; ring.scale.setScalar(0.95); root.add(ring);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(1.2, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; root.add(blob);

  // 다리: 슬림 교복 바지 + 하이탑. 한쪽 다리는 삐딱하게
  const legs = [];
  for (const sx of [-0.3, 0.3]) {
    const hip = new THREE.Group(); hip.position.set(sx, 1.1, 0); body.add(hip);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.2, 1.0, 12), m.pants); leg.position.y = -0.5; hip.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, 0.68), m.shoe); shoe.position.set(0, -1.0, 0.1); hip.add(shoe);
    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.7), m.sole); sole.position.set(0, -1.14, 0.1); hip.add(sole);
    legs.push(hip);
  }
  legs[1].rotation.z = -0.16;   // 짝다리

  // 몸통: 셔츠 밖으로 빼입고, 넥타이 느슨하게, 카라 세움
  const torso = new THREE.Group(); torso.position.y = 1.0; body.add(torso);
  const shirt = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, 1.45, 18), m.shirt); shirt.position.y = 0.72; torso.add(shirt);
  const vneck = new THREE.Mesh(new THREE.CircleGeometry(0.2, 3), m.skin); vneck.position.set(0, 1.3, 0.56); vneck.rotation.z = -Math.PI / 2; vneck.scale.set(1, 0.8, 1); torso.add(vneck);
  const knot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.15, 0.08), m.tie); knot.position.set(0.06, 1.12, 0.58); knot.rotation.z = 0.35; torso.add(knot);
  const tie = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.62, 0.04), m.tie); tie.position.set(0.14, 0.78, 0.6); tie.rotation.z = 0.28; torso.add(tie);
  for (const s of [-1, 1]) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.04), m.shirt); col.position.set(s * 0.26, 1.52, 0.42); col.rotation.set(-0.5, s * 0.6, s * 0.25); torso.add(col);   // 세운 카라
  }
  // 어깨에만 걸친 교복 마이 (팔은 안 끼움)
  const cape = new THREE.Group(); torso.add(cape);
  const OPEN = 0.95;
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.9, 1.45, 22, 1, true, OPEN, Math.PI * 2 - OPEN * 2), m.blazer); shell.position.y = 0.82; cape.add(shell);
  const capS = new THREE.Mesh(new THREE.SphereGeometry(0.73, 22, 10, Math.PI / 2 + OPEN, Math.PI * 2 - OPEN * 2, 0, Math.PI / 2), m.blazer); capS.scale.y = 0.45; capS.position.y = 1.54; cape.add(capS);
  const sleeves = [];
  for (const s of [-1, 1]) {   // 빈 소매가 덜렁덜렁
    const piv = new THREE.Group(); piv.position.set(s * 0.82, 1.5, -0.12); cape.add(piv);
    const sl = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 1.15, 10), m.blazer); sl.position.y = -0.58; piv.add(sl);
    piv.rotation.z = s * 0.08; sleeves.push(piv);
  }
  // 팔: 셔츠 소매 걷음 + 두 손은 주머니에
  const arms = [];
  for (const s of [-1, 1]) {
    const shd = new THREE.Group(); shd.position.set(s * 0.62, 1.38, 0.02); torso.add(shd);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.5, 10), m.shirt); sleeve.position.y = -0.25; shd.add(sleeve);
    const roll = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 6, 12), m.shirt); roll.rotation.x = Math.PI / 2; roll.position.y = -0.5; shd.add(roll);
    const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.13, 0.45, 10), m.skin); fore.position.y = -0.74; shd.add(fore);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), m.skin); hand.position.y = -0.98; hand.scale.set(0.8, 0.5, 0.8); shd.add(hand);   // 주머니에 반쯤 들어간 손
    shd.rotation.z = s * 0.1; shd.userData.baseZ = s * 0.1;
    arms.push(shd);
  }
  for (const s of [-1, 1]) { const pk = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.28, 0.2), std('#15161c')); pk.position.set(s * 0.6, 0.12, 0.12); torso.add(pk); }   // 주머니 입구

  // 큰 대가리
  const head = new THREE.Group(); head.position.y = 2.38; torso.add(head);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.95, 30, 24), m.skin); face.scale.set(1.04, 1, 0.97); head.add(face);
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.62, 18, 14), m.skin); jaw.position.set(0, -0.48, 0.22); jaw.scale.set(1.15, 0.6, 1); head.add(jaw);
  // 가오 머리: 옆으로 넘긴 긴 앞머리 + 한 가닥 + 목덜미까지
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1.0, 30, 16, 0, Math.PI * 2, 0, Math.PI / 2.15), m.hair); cap.position.set(0, 0.08, -0.05); cap.scale.set(1.06, 1.05, 1.06); cap.rotation.x = -0.22; head.add(cap);
  const vol = new THREE.Mesh(new THREE.SphereGeometry(0.85, 22, 14), m.hair); vol.position.set(0.1, 0.62, 0.05); vol.scale.set(1.15, 0.55, 1.1); head.add(vol);   // 정수리 볼륨
  const bangs = [[0.55, 0.62, 0.62, 0.45, 0.2, 0.55, -0.5], [0.15, 0.6, 0.78, 0.5, 0.2, 0.6, -0.65], [-0.25, 0.5, 0.82, 0.5, 0.2, 0.55, -0.8], [-0.62, 0.3, 0.7, 0.42, 0.18, 0.5, -1.0]];
  for (const [x, y, z, sx, sy, sz, rz] of bangs) {   // 오른쪽 위에서 왼쪽 아래로 쓸어넘김
    const b = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), m.hair); b.position.set(x, y, z); b.scale.set(sx, sy, sz); b.rotation.set(0.35, 0, rz); head.add(b);
  }
  const lock = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.5, 4, 8), m.hair); lock.position.set(-0.38, 0.12, 0.92); lock.rotation.set(0.25, 0, -0.5); head.add(lock);   // 눈썹 덮는 가오 한 가닥
  for (const s of [-1, 1]) {   // 귀를 덮고 턱선까지 오는 옆머리 (끝으로 갈수록 가늘게)
    const side = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), m.hair); side.position.set(s * 0.9, -0.1, 0.02); side.scale.set(0.16, 0.5, 0.38); side.rotation.z = s * 0.12; head.add(side);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), m.hair); tip.position.set(s * 0.86, -0.62, 0.12); tip.rotation.set(Math.PI, 0, -s * 0.15); head.add(tip);
  }
  const back = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.78, 1.1, 24, 1, true, Math.PI * 0.55, Math.PI * 0.9), std('#1b130e', { roughness: 0.45, side: THREE.DoubleSide })); back.position.set(0, -0.35, -0.05); head.add(back);   // 목덜미까지 오는 뒷머리
  // 얼굴
  for (const s of [-1, 1]) {

    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), m.eye); eye.position.set(s * 0.32, 0.02, 0.88); eye.scale.set(1.3, 0.55, 0.6); head.add(eye);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.05, 0.05), std('#c99a76')); lid.position.set(s * 0.32, 0.07, 0.9); head.add(lid);
    // 두꺼운 뿔테
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.075, 8, 28), m.frame); rim.position.set(s * 0.34, 0.04, 0.95); rim.scale.set(1.15, 0.85, 1); head.add(rim);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.24, 22), m.lens); lens.position.set(s * 0.34, 0.04, 0.965); lens.scale.set(1.15, 0.85, 1); head.add(lens);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.12, 0.1), m.frame); top.position.set(s * 0.34, 0.24, 0.96); head.add(top);
    const tm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.95), m.frame); tm.position.set(s * 0.92, 0.1, 0.5); tm.rotation.y = s * 0.1; head.add(tm);
  }
  // 왼쪽 렌즈 반사광 (눈이 안 보임 = 가오)
  for (const [y, w] of [[0.1, 0.22], [-0.02, 0.14]]) { const g = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, 0.01), m.glare); g.position.set(-0.32, y, 0.975); g.rotation.z = 0.6; head.add(g); }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.07, 0.07), m.frame); bridge.position.set(0, 0.08, 0.98); head.add(bridge);
  // 눈썹: 오른쪽만 치켜올림
  const browR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.07, 0.05), m.hair); browR.position.set(0.34, 0.4, 0.88); browR.rotation.z = -0.3; head.add(browR);

  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 6, 16, Math.PI * 0.55), m.mouth); mouth.position.set(0.12, -0.38, 0.86); mouth.rotation.z = Math.PI * 1.32; head.add(mouth);   // 한쪽만 올라간 비웃음
  const gum = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), m.gum); gum.position.set(-0.12, -0.42, 1.0); gum.scale.setScalar(0.01); head.add(gum);
  // "반창고는 패션이야"
  const band = new THREE.Group(); band.position.set(0.55, -0.2, 0.78); band.rotation.set(0, 0.55, -0.4); head.add(band);
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.11, 0.02), m.band); band.add(b1);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.025), std('#e0b070')); band.add(b2);

  const stars = new THREE.Group(); stars.position.y = 4.4; model.add(stars); stars.visible = false;
  for (let i = 0; i < 4; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), new THREE.MeshBasicMaterial({ color: '#ffe23a' }));
    st.position.set(Math.cos(i * Math.PI / 2) * 0.9, 0, Math.sin(i * Math.PI / 2) * 0.9); stars.add(st);
  }
  shadowAll(model);
  return { root, model, body, torso, head, legs, arms, stars, sleeves, gum, flashMats: [m.skin, m.shirt, m.blazer, m.pants] };
}

// ── 마우스(소환수) 3D ──────────────────────────────
function makeMouse(color) {

function fxCtrl(x, z, a, r, hitId, near) {
  const tv = hitId && views[hitId];
  const len = tv ? Math.hypot(tv.model.root.position.x - x, tv.model.root.position.z - z) : r;
  const g = new THREE.Group(); g.position.set(x, 2.6, z); g.rotation.y = -a;
  const beam = new THREE.Mesh(new THREE.BoxGeometry(1, 0.35, 0.35), addMat('#d36bff', 0.9)); g.add(beam);
  const core = new THREE.Mesh(new THREE.BoxGeometry(1, 0.14, 0.14), addMat('#ffffff', 1)); g.add(core);
  addFx(0.45, g, (k) => {
    const q = Math.min(1, k * 3), L = Math.max(0.01, len * q);
    beam.scale.x = core.scale.x = L; beam.position.x = core.position.x = L / 2;
    beam.material.opacity = 0.9 * (1 - k); core.material.opacity = 1 - k;
  });
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.07, 6, 24), addMat('#ff8af0', 1));
    const w = new THREE.Group(); w.position.set(x, 2.6, z); w.rotation.y = -a; ring.rotation.y = Math.PI / 2; w.add(ring);
    addFx(0.5, w, (k) => { ring.position.x = len * k; ring.material.opacity = 1 - k; ring.scale.setScalar(1 + k); }, i * 0.08);
  }
  popup('너 등신이냐?!', { x: x + Math.cos(a) * 2, z: z + Math.sin(a) * 2 }, 6.2, '#ff8af0', 36, 1.3);
  if (tv) {
    const tp = tv.model.root.position;
    burst(tp.x, 3, tp.z, 30, ['#d36bff', '#ff8af0', '#ffffff'], { speed: 6, size: 0.18, up: 6, life: 0.8 });
    popup('🎮', tp, 5.6, '#fff', 40, 1.2);
    if (hitId === myId) shake = Math.max(shake, 0.8);
  }
  if (near) shake = Math.max(shake, 0.5);
}
// 조종 중일 때 조종하는 사람 ↔ 꼭두각시를 잇는 실
const strings = {};
function updateStrings(now) {
  const seen = new Set();
  for (const p of state.players) {
    if (!p.ctrl) continue;
    const a = views[p.id], b = views[p.ctrl]; if (!a || !b) continue;
    seen.add(p.id);
    let L = strings[p.id];
    if (!L) {
      const pos = new Float32Array(3 * 7 * 6);   // 3가닥 × 7마디 × 선분(점 2개)
      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      L = strings[p.id] = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#ff8af0', transparent: true, opacity: 0.9 }));
      scene.add(L);
    }
    const pa = a.model.root.position, pb = b.model.root.position, arr = L.geometry.attributes.position.array;
    let i = 0;
    for (const off of [-0.5, 0, 0.5]) {          // 실 3가닥, 살짝 출렁임
      let px = pa.x, py = 4.4, pz = pa.z;
      for (let k = 1; k <= 7; k++) {
        const t = k / 7, sag = Math.sin(t * Math.PI) * (1.2 + Math.sin(now * 4 + off * 3) * 0.3);
        const nx = pa.x + (pb.x - pa.x) * t + off * Math.sin(t * Math.PI), ny = 4.4 + (4.6 - 4.4) * t + sag, nz = pa.z + (pb.z - pa.z) * t;
        arr.set([px, py, pz, nx, ny, nz], i); i += 6; px = nx; py = ny; pz = nz;
      }
    }
    L.geometry.attributes.position.needsUpdate = true;
    L.material.opacity = 0.6 + Math.sin(now * 10) * 0.3;
  }
  for (const id in strings) if (!seen.has(id)) { scene.remove(strings[id]); delete strings[id]; }
}

  const j = await r.json().catch(() => ({}));

  return j;
}

  const me = src || state.players.find((p) => p.id === myId); if (!me) return null;
