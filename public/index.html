<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>정보쌤 브롤</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f4f; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }
  .stroke { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 3px 0 #000; }
  input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 3px solid #000; background: #fff; color: #111; outline: none; }
  .btn { padding: 12px 18px; font-size: 20px; font-weight: 900; border: 4px solid #000; border-radius: 14px; background: linear-gradient(#ffe36b, #ffbf1f); color: #111; box-shadow: 0 6px 0 #000; cursor: pointer; font-family: inherit; }
  .btn:active, .pbtn:active, .lb:active, .bcard:active { transform: translateY(3px); }
  .btn.gray { background: linear-gradient(#e6e6ef, #b9b9cc); }

  /* ── 로비 ── */
  #lobbyBg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 30%, #ffd9f2 0%, #e48bff 30%, #7a3bc7 62%, #2c1458 100%); overflow: hidden; }
  #lobbyBg .sun { position: absolute; left: 50%; top: 46%; width: 54vmin; height: 54vmin; margin: -27vmin; border-radius: 50%; background: radial-gradient(circle, #fff8c4, #ffd45a 55%, rgba(255,190,70,0) 71%); }
  #lobbyBg .floor { position: absolute; left: -10%; right: -10%; bottom: -12%; height: 42%; border-radius: 50% 50% 0 0; background: linear-gradient(#5a3fb0, #24154f 70%); box-shadow: 0 -6px 0 rgba(255,255,255,.12) inset; }
  #lobbyBg .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255,255,255,.07) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lobby { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #lobby > * { pointer-events: auto; }
  .panel { background: linear-gradient(#45478a, #2b2c58); border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; }
  #profile { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; cursor: pointer; }
  #profile .av { width: 46px; height: 46px; border-radius: 9px; border: 3px solid #000; background: linear-gradient(#ffe36b, #ffb31f); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  #profile .pn { font-weight: 900; font-size: 16px; }
  #profile .tr { font-weight: 900; font-size: 15px; color: #ffd84a; }
  #lbtns { position: absolute; left: 10px; top: 80px; display: flex; flex-direction: column; gap: 10px; }
  .lb { width: 74px; padding: 6px 0 5px; text-align: center; font-weight: 900; font-size: 13px; cursor: pointer; }
  .lb .ic { font-size: 30px; line-height: 1.1; display: block; }
  #showName { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); text-align: center; white-space: nowrap; pointer-events: none; }
  .rbadge { text-shadow: none; display: inline-block; padding: 3px 12px; border-radius: 8px; border: 3px solid #000; font-weight: 900; font-size: 13px; color: #111; box-shadow: 0 3px 0 #000; }
  #showName .nm2 { font-size: 34px; font-weight: 900; margin-top: 6px; }
  #showName .tt { font-size: 14px; font-weight: 800; opacity: .9; margin-top: 2px; }
  #playWrap { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: stretch; }
  #modeBox { padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 150px; }
  #modeBox b { font-size: 17px; color: #ffd84a; }
  #modeBox span { font-size: 12px; opacity: .85; margin-top: 2px; }
  .pbtn { min-width: 170px; font-size: 32px; font-weight: 900; border: 4px solid #000; border-radius: 14px; background: linear-gradient(#fff07a, #ffc21f 60%, #f0a400); color: #111; box-shadow: 0 6px 0 #000; cursor: pointer; font-family: inherit; padding: 10px 26px; }
  @media (orientation: portrait) {
    #playWrap { left: 12px; flex-direction: column; }
    .pbtn { font-size: 30px; padding: 14px; }
    #showName { top: 13%; }
  }
  #status { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); font-weight: 900; font-size: 18px; pointer-events: none; }

  /* ── 브롤러 선택 ── */
  #bscreen { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; background: radial-gradient(circle at 50% 0%, #4a3aa8, #1a1238 70%); }
  #bscreen header { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .back { width: 48px; height: 42px; font-size: 22px; font-weight: 900; border: 3px solid #000; border-radius: 10px; background: linear-gradient(#ffe36b, #ffb31f); box-shadow: 0 4px 0 #000; cursor: pointer; }
  #bscreen h2 { margin: 0; font-size: 26px; font-weight: 900; }
  #bscreen .cnt { margin-left: auto; font-weight: 900; opacity: .85; }
  #bgrid { flex: 1; overflow-y: auto; padding: 8px 14px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; align-content: start; touch-action: pan-y; }
  .bcard { position: relative; height: 158px; border: 3px solid #000; border-radius: 12px; box-shadow: 0 5px 0 #000; overflow: hidden; cursor: pointer; }
  .bcard img { position: absolute; left: 0; right: 0; top: 4px; margin: auto; height: 118px; }
  .bcard .bn { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 0 5px; background: rgba(0,0,0,.55); text-align: center; font-weight: 900; font-size: 15px; }
  .bcard .rr { position: absolute; left: 6px; top: 5px; font-size: 11px; font-weight: 900; color: #111; background: rgba(255,255,255,.7); padding: 1px 6px; border-radius: 6px; }
  .bcard.sel { outline: 4px solid #fff; outline-offset: -8px; }
  .bcard .ck { position: absolute; right: 6px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #3ce07f; border: 3px solid #000; color: #000; font-weight: 900; display: none; align-items: center; justify-content: center; font-size: 15px; }
  .bcard.sel .ck { display: flex; }
  .bcard.locked { background: repeating-linear-gradient(45deg, #3a3a52, #3a3a52 10px, #34344a 10px, #34344a 20px); cursor: default; }
  .bcard.locked .q { position: absolute; inset: 0 0 30px; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 900; opacity: .35; }
  #bdetail { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(10,6,30,.75); }
  #bdetail .box { width: min(94vw, 760px); max-height: 92vh; overflow-y: auto; display: flex; gap: 14px; padding: 14px; }
  #bdetail .pic { flex: 0 0 210px; border: 3px solid #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

  #bdetail .info { flex: 1; min-width: 0; }
  #bdetail .dn { font-size: 30px; font-weight: 900; margin: 6px 0 0; }
  #bdetail .dq { color: #ffd84a; font-weight: 800; margin: 2px 0 6px; }
  #bdetail .dd { font-size: 13px; opacity: .9; line-height: 1.5; }

  .sk { display: flex; gap: 10px; align-items: flex-start; background: rgba(0,0,0,.3); border-radius: 10px; padding: 7px 9px; margin-top: 6px; }
  .sk .si { flex: 0 0 38px; height: 38px; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .sk .st { font-size: 11px; font-weight: 900; opacity: .7; }
  .sk .sn { font-weight: 900; font-size: 15px; }
  .sk .sd { font-size: 12px; opacity: .85; line-height: 1.4; }
  #bdetail .acts { display: flex; gap: 10px; margin-top: 12px; }
  @media (orientation: portrait) { #bdetail .box { flex-direction: column; } #bdetail .pic { flex: 0 0 auto; height: 180px; } #bdetail .pic img { width: 170px; } }
  #modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(10,6,30,.7); }
  #modal .box { width: min(90vw, 340px); padding: 18px; text-align: center; }
  #modal h3 { margin: 0 0 12px; font-size: 20px; }
  #modal .acts { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #help { font-size: 13px; line-height: 1.7; text-align: left; }
  #help b { color: #ffd84a; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
  .nm { font-weight: 900; font-size: 14px; }
  .hpb { width: 74px; height: 12px; margin: 2px auto 0; background: #000; border-radius: 5px; padding: 2px; }
  .hpb i { display: block; height: 100%; border-radius: 3px; background: #ff4d4d; transition: width .1s; }
  .me .hpb i { background: #3ce07f; }
  .am { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
  .am i { width: 22px; height: 7px; background: #000; border-radius: 3px; overflow: hidden; position: relative; }
  .am i b { position: absolute; left: 0; top: 0; bottom: 0; background: #ffb02e; }
  .bub { display: none; margin: 0 auto 6px; background: #fff; color: #111; border: 3px solid #000; border-radius: 12px; padding: 4px 10px; font-weight: 900; font-size: 14px; position: relative; animation: pop .18s ease-out; }
  .bub:after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-top-color: #000; border-bottom: 0; }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .pp { position: absolute; transform: translate(-50%, -50%); font-weight: 900; white-space: nowrap; }

  #top { position: fixed; top: 8px; left: 8px; z-index: 6; display: none; gap: 6px; pointer-events: auto; }
  #top button { padding: 7px 10px; font-size: 13px; font-weight: 800; border: 3px solid #000; border-radius: 9px; background: #fff; cursor: pointer; }
  #board { position: fixed; top: 8px; right: 12px; z-index: 6; text-align: right; font-weight: 800; font-size: 14px; line-height: 1.5; }
  #feed { position: fixed; top: 52px; left: 0; right: 0; z-index: 6; text-align: center; font-weight: 900; font-size: 15px; color: #ff9a9a; line-height: 1.6; }

  #ctrl { position: fixed; right: 14px; bottom: 16px; z-index: 8; display: none; width: 160px; height: 160px; }
  .cb { position: absolute; border-radius: 50%; border: 3px solid #000; touch-action: none; font-weight: 900; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; box-shadow: 0 5px 0 #000; cursor: pointer; pointer-events: auto; }
  .cb small { font-size: 8px; opacity: .7; }
  .cb .gi { font-size: 22px; line-height: 1; }
  .cb .n { position: absolute; top: -6px; right: -6px; background: #000; color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 6px; }
  .cb .cd { position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: none; align-items: center; justify-content: center; font-size: 13px; }
  #bAtk { right: 0; bottom: 0; width: 80px; height: 80px; background: radial-gradient(circle at 40% 35%, #ffe98a, #ffb31f); font-size: 13px; }
  #bG1 { right: 94px; bottom: 2px; width: 52px; height: 52px; background: radial-gradient(circle at 40% 35%, #c9f6ff, #4fd2ff); font-size: 10px; }
  #bSup { right: 76px; bottom: 70px; width: 62px; height: 62px; font-size: 11px; color: #fff; background: #3a2a6a; }
  #bSup.ready { animation: glow .7s infinite alternate; color: #111; }
  @keyframes glow { from { box-shadow: 0 5px 0 #000, 0 0 10px 3px #ffb31f; } to { box-shadow: 0 5px 0 #000, 0 0 26px 10px #ff5a1f; } }
  #bG2 { right: 10px; bottom: 94px; width: 52px; height: 52px; background: radial-gradient(circle at 40% 35%, #d8ffd0, #63e65a); font-size: 10px; }
  #aimJoy { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border: 3px solid rgba(255,140,40,.8); background: rgba(255,120,30,.12); border-radius: 50%; display: none; z-index: 9; pointer-events: none; }
  #aimJoy.atk { border-color: rgba(255,220,80,.85); background: rgba(255,220,80,.12); }
  #aimJoy.atk i { background: rgba(255,225,100,.95); }
  #aimJoy.cancel { border-color: rgba(255,80,80,.9); background: rgba(255,40,40,.18); }
  #aimJoy b { position: absolute; left: 0; right: 0; top: -26px; text-align: center; font-size: 14px; color: #ff6b6b; display: none; }
  #aimJoy.cancel b { display: block; }
  #aimJoy i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(255,170,60,.9); border: 3px solid #000; }
</style>

<body>

<div id="lobby">

<script type="module">
import * as THREE from 'three';

const S = 0.05;                       // 서버 px → 3D 월드 단위
const isTouch = 'ontouchstart' in window;
const $ = (id) => document.getElementById(id);

// ── 렌더러 / 씬 ───────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1f4f');
scene.fog = new THREE.Fog('#2a1f4f', 70, 140);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

scene.add(new THREE.HemisphereLight('#ffffff', '#7a5aa8', 1.15));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 90 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

let W = 1, H = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  if (typeof lobbyCam !== 'undefined') { lobbyCam.aspect = W / H; lobbyCam.updateProjectionMatrix(); }
}
addEventListener('resize', resize); resize();

// ── 공용 재질 ─────────────────────────────────────
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
const basicCache = {};
const basic = (c) => basicCache[c] || (basicCache[c] = new THREE.MeshBasicMaterial({ color: c, transparent: true }));
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// ── 맵 (컴퓨터실) ─────────────────────────────────
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const floorTex = canvasTex(256, 256, (g, w, h) => {
  const cols = ['#d9dbe8', '#c9cde0'];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = cols[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
  g.strokeStyle = 'rgba(60,60,90,.35)'; g.lineWidth = 4;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
  for (let k = 0; k < 140; k++) { g.fillStyle = `rgba(80,80,120,${Math.random() * 0.12})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
const screenTex = canvasTex(128, 96, (g) => {
  g.fillStyle = '#0b1a3a'; g.fillRect(0, 0, 128, 96);
  const cs = ['#5ee0ff', '#ffd84a', '#ff7ac6', '#7dff8a', '#ffffff'];
  for (let y = 10; y < 90; y += 9) { let x = 8 + Math.floor(Math.random() * 3) * 8; while (x < 110 && Math.random() < 0.8) { const w = 8 + Math.random() * 26; g.fillStyle = cs[Math.floor(Math.random() * cs.length)]; g.fillRect(x, y, w, 4); x += w + 5; } }
});

function buildMap(MAP) {
  const fw = MAP.w * S, fh = MAP.h * S;
  floorTex.repeat.set(fw / 6, fh / 6);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), std('#ffffff', { map: floorTex, roughness: 0.55 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(fw / 2, 0, fh / 2); floor.receiveShadow = true;
  scene.add(floor);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(fw + 200, fh + 200), std('#3a2b6e'));
  outer.rotation.x = -Math.PI / 2; outer.position.set(fw / 2, -0.02, fh / 2); outer.receiveShadow = true; scene.add(outer);
  // 외곽 벽
  const bm = std('#7b5cff', { roughness: 0.5 }), bm2 = std('#5a3fd6');
  const T = 1.2, HH = 1.3;
  for (const [x, z, w, d] of [[fw / 2, -T / 2, fw + 2 * T, T], [fw / 2, fh + T / 2, fw + 2 * T, T], [-T / 2, fh / 2, T, fh], [fw + T / 2, fh / 2, T, fh]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, HH, d), bm); b.position.set(x, HH / 2, z);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.2, d + 0.1), bm2); cap.position.set(x, HH + 0.1, z);
    scene.add(b, cap); shadowAll(b); shadowAll(cap);
  }
  // 책상 + 모니터
  const wood = std('#b07a46', { roughness: 0.55 }), woodD = std('#7a4e2b'), dark = std('#222630', { roughness: 0.4 }), key = std('#e9e9ef');
  const scr = new THREE.MeshBasicMaterial({ map: screenTex });
  for (const w of MAP.walls) {
    const cx = (w.x + w.w / 2) * S, cz = (w.y + w.h / 2) * S, sw = w.w * S, sd = w.h * S;
    const g = new THREE.Group(); g.position.set(cx, 0, cz);
    const body = new THREE.Mesh(new THREE.BoxGeometry(sw - 0.3, 1.25, sd - 0.3), woodD); body.position.y = 0.63;
    const top = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.22, sd), wood); top.position.y = 1.36;
    g.add(body, top);
    const along = sw >= sd, len = along ? sw : sd, n = Math.max(1, Math.floor(len / 2.6));
    for (let i = 0; i < n; i++) {
      const off = -len / 2 + len / n * (i + 0.5);
      const mon = new THREE.Group();
      const stand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), dark); stand.position.y = 1.7;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 0.12), dark); frame.position.y = 2.35;

function lightning(from, to) {
  const N = 9, pos = new Float32Array(N * 3);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: '#bff6ff', transparent: true, blending: THREE.AdditiveBlending }));
  addFx(0.55, line, (k) => {
    const a = from(), b = to();
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), j = i === 0 || i === N - 1 ? 0 : 0.7;
      pos[i * 3] = a.x + (b.x - a.x) * t + (Math.random() - 0.5) * j;
      pos[i * 3 + 1] = 2.4 + (Math.random() - 0.5) * j;
      pos[i * 3 + 2] = a.z + (b.z - a.z) * t + (Math.random() - 0.5) * j;

    geo.attributes.position.needsUpdate = true;
    line.material.opacity = Math.random() < 0.3 ? 0.2 : 1 - k * 0.6;

}

function autoAim(range) {    // 사거리 안 가장 가까운 적

  let best = (range || BR[me.b].super.range) + 120, a = me.f;

  if (p.hp < v.lastHp - 1 && !p.dead) v.hitT = 0;
  v.lastHp = p.hp;
  if (p.dead && !v.dead) { v.deadT = 0; burst(root.position.x, 2, root.position.z, 40, ['#111', '#8fd3ff', '#ffcf3a', '#f1c39c', '#777'], { speed: 9, size: 0.3, up: 10, life: 1.1 }); if (p.id === myId) shake = 0.6; }
  if (!p.dead && v.dead) fxSpawn(root.position.x, root.position.z);
  v.dead = p.dead;

  v.atkT += dt; v.g1T += dt; v.g2T += dt; v.superT += dt; v.hitT += dt; v.deadT += dt;
  const walk = Math.min(1, v.speed / 8);
  v.phase += dt * (6 + v.speed * 0.9);
  const s = Math.sin(v.phase);

  // 기본 포즈 + 걷기
  M.legs[0].rotation.x = s * 0.75 * walk;
  M.legs[1].rotation.x = -s * 0.75 * walk;
  let armX = [-s * 0.6 * walk, s * 0.6 * walk], armZ = [M.arms[0].userData.baseZ, M.arms[1].userData.baseZ];
  let bodyY = Math.abs(s) * 0.22 * walk, sx = 1, sy = 1 + Math.sin(now * 2.2) * 0.025, spin = 0, lean = walk * 0.12;
  M.torso.rotation.z = Math.sin(v.phase) * 0.07 * walk;
  M.head.rotation.y = 0;

  // 기본공격: 두 팔 번쩍 → 점프 → 내려찍기
  if (v.atkT < 0.55) {
    const t = v.atkT;
    if (t < 0.11) { const q = ease(t / 0.11); armX = [-2.9 * q, -2.9 * q]; armZ = [-0.2, 0.2]; bodyY += 1.1 * q; sy = 1 + 0.15 * q; sx = 1 - 0.08 * q; }
    else if (t < 0.2) { const q = (t - 0.11) / 0.09; armX = [-2.9 + 2.2 * q, -2.9 + 2.2 * q]; bodyY += 1.1 * (1 - q); sy = 1 + 0.15 - 0.4 * q; sx = 1 + 0.2 * q; lean = 0.35 * q; }
    else { const q = ease((t - 0.2) / 0.35); armX = [-0.7 * (1 - q), -0.7 * (1 - q)]; sy = 0.75 + 0.25 * q + Math.sin(q * 14) * 0.06 * (1 - q); sx = 1.2 - 0.2 * q; lean = 0.35 * (1 - q); }
    M.head.rotation.y = Math.sin(now * 40) * 0.12 * Math.max(0, 1 - t * 2);
  }
  // 가젯1: 손가락질 + 뒤로 젖히기
  if (v.g1T < 0.7) {
    const q = v.g1T < 0.1 ? v.g1T / 0.1 : 1 - Math.max(0, v.g1T - 0.5) / 0.2;
    armX[1] = -1.6 * q; armZ[1] = 0.1;
    armX[0] = -0.3 * q; armZ[0] = -0.9 * q;
    lean = -0.25 * q; M.head.rotation.y = Math.sin(now * 30) * 0.15 * q;
  }
  // 가젯2: 팔 벌리고 한 바퀴
  if (v.g2T < 0.7) {
    const t = v.g2T, q = t < 0.1 ? t / 0.1 : 1 - Math.max(0, t - 0.5) / 0.2;
    armZ = [-2.3 * q, 2.3 * q]; armX = [0, 0];
    spin = ease(Math.min(1, t / 0.45)) * Math.PI * 2; bodyY += Math.sin(Math.min(1, t / 0.45) * Math.PI) * 0.8;
  }
  // 궁극기: 숨 크게 들이쉬고 → 앞으로 몸 날리며 고함
  if (v.superT < 0.8) {
    const t = v.superT;
    if (t < 0.16) { const q = ease(t / 0.16); lean = -0.45 * q; sx = 1 + 0.18 * q; sy = 1 + 0.12 * q; armX = [-2.4 * q, -2.4 * q]; armZ = [-0.9 * q, 0.9 * q]; bodyY += 0.3 * q; }
    else { const q = ease(Math.min(1, (t - 0.16) / 0.12)), r = Math.max(0, (t - 0.5) / 0.3);
      lean = 0.55 * q * (1 - r); armX = [-1.5 * (1 - r), -1.5 * (1 - r)]; armZ = [-0.7 * (1 - r), 0.7 * (1 - r)];
      sx = 1 + Math.sin(t * 50) * 0.05 * (1 - r); sy = 1 - 0.08 * (1 - r);
      M.head.rotation.y = Math.sin(now * 50) * 0.1 * (1 - r); }
  }
  M.arms[0].rotation.x = armX[0]; M.arms[1].rotation.x = armX[1];
  M.arms[0].rotation.z = armZ[0]; M.arms[1].rotation.z = armZ[1];
  M.body.position.y = bodyY;
  M.body.scale.set(sx, sy, sx);
  M.body.rotation.x = lean;
  M.body.rotation.y = spin;

  // 피격 반짝
  const fl = v.hitT < 0.2 ? (1 - v.hitT / 0.2) : 0;
  for (const m of M.flashMats) { m.emissive.setRGB(fl, fl * 0.3, fl * 0.3); }
  if (v.hitT < 0.15) M.model.position.x = (Math.random() - 0.5) * 0.25; else M.model.position.x = 0;

  // 스턴
  M.stars.visible = p.stun && !p.dead;
  if (M.stars.visible) { M.stars.rotation.y = now * 5; M.body.rotation.z = Math.sin(now * 8) * 0.12; } else M.body.rotation.z = 0;

  // 사망 연출
  if (p.dead) {
    const q = Math.min(1, v.deadT / 0.35);
    M.model.rotation.x = -q * Math.PI / 2; M.model.position.y = -q * 0.5;
    M.model.visible = v.deadT < 1.2;
  } else { M.model.rotation.x = 0; M.model.position.y = 0; M.model.visible = true; }
}

function updateLabel(v, p) {
  const L = v.label, pos = v.model.root.position;
  const [x, y, vis] = toScreen(pos.x, 5.0 + v.model.body.position.y * 0.5, pos.z);
  L.d.style.display = p.dead || !vis ? 'none' : 'block';
  L.d.style.left = x + 'px'; L.d.style.top = y + 'px';
  L.nm.textContent = `${p.name}  ${p.hp}`;
  L.hp.style.width = (100 * p.hp / (BR[p.b] ? BR[p.b].maxHp : p.hp || 1)) + '%';
  L.am.forEach((b, i) => { const f = Math.max(0, Math.min(1, p.ammo - i)); b.style.width = f * 100 + '%'; b.style.background = f >= 1 ? '#ffb02e' : '#8a6a32'; });
  if (p.say !== L.lastSay) { L.lastSay = p.say; if (p.say) { L.bub.textContent = p.say; L.bub.style.display = 'block'; L.bub.style.animation = 'none'; L.bub.offsetWidth; L.bub.style.animation = ''; } else L.bub.style.display = 'none'; }
}

function animateMouse(mv, m, dt, now) {
  const tx = m.x * S, tz = m.y * S, g = mv.obj.g;
  const k = Math.min(1, dt * 14);
  g.position.x += (tx - g.position.x) * k; g.position.z += (tz - g.position.z) * k;
  g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(Math.cos(m.a), Math.sin(m.a)), Math.min(1, dt * 12));
  mv.obj.inner.position.y = Math.abs(Math.sin(now * 18 + mv.seed)) * 0.25;
  mv.obj.inner.rotation.z = Math.sin(now * 18 + mv.seed) * 0.15;
  mv.obj.wheel.rotation.x = now * 20;
  mv.obj.cable.forEach((c, i) => { const t = i + 1; c.position.set(Math.sin(now * 14 - t * 0.9 + mv.seed) * 0.12 * t * 0.5, 0.18, -0.55 - t * 0.17); });
}

// ── 메인 루프 ────────────────────────────────────
const camTarget = new THREE.Vector3(40, 0, 30);
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  const now = nowMs / 1000;
  if (MAP) {
    const alive = new Set();
    for (const p of state.players) { const v = getView(p); alive.add(p.id); animateTeacher(v, p, dt, now); updateLabel(v, p); }
    for (const id in views) if (!alive.has(id)) { scene.remove(views[id].model.root); views[id].label.d.remove(); delete views[id]; }
    const malive = new Set();
    for (const m of state.mice) {
      let mv = mviews[m.id];
      if (!mv) { const obj = makeMouse(m.c); obj.g.position.set(m.x * S, 0, m.y * S); scene.add(obj.g); mv = mviews[m.id] = { obj, seed: Math.random() * 10 }; }
      malive.add(String(m.id)); animateMouse(mv, m, dt, now);
    }
    for (const id in mviews) if (!malive.has(id)) { const g = mviews[id].obj.g; burst(g.position.x, 0.5, g.position.z, 10, ['#f2f2f6', '#7dff8a'], { speed: 4, size: 0.12, up: 5, life: 0.5 }); scene.remove(g); delete mviews[id]; }

    // 카메라 (브롤스타즈처럼 비스듬히 위에서)
    const mp = myPos();
    if (mp) camTarget.lerp(mp, Math.min(1, dt * 6));
    const far = camera.aspect < 1 ? 1.75 : 1;
    camera.position.set(camTarget.x, 20 * far, camTarget.z + 20 * far);
    if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 2.2); }
    camera.lookAt(camTarget.x, 1.2, camTarget.z + 1);
    sun.position.set(camTarget.x + 12, 30, camTarget.z + 10); sun.target.position.copy(camTarget);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    if (e.t < 0) continue;
    if (e.once) { e.once(); effects.splice(i, 1); continue; }
    if (e.obj) e.obj.visible = true;
    const k = e.t / e.dur;
    if (k >= 1) { if (e.obj) scene.remove(e.obj); effects.splice(i, 1); }
    else e.upd(k, e);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t >= p.life) { scene.remove(p.mesh); parts.splice(i, 1); continue; }
    p.vy -= p.grav * dt;
    p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
    if (p.mesh.position.y < 0.08) { p.mesh.position.y = 0.08; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
    p.mesh.rotation.x += dt * 8; p.mesh.rotation.y += dt * 6;
    p.mesh.scale.setScalar(p.s0 * (1 - p.t / p.life));
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt; const k = p.t / p.dur;
    if (k >= 1) { p.d.remove(); pops.splice(i, 1); continue; }
    const [x, y] = toScreen(p.x, p.y + k * 1.5, p.z);
    p.d.style.left = x + 'px'; p.d.style.top = y + 'px';
    p.d.style.opacity = k > 0.6 ? (1 - k) / 0.4 : 1;
    p.d.style.transform = `translate(-50%,-50%) scale(${k < 0.15 ? 0.5 + k / 0.15 * 0.8 : 1.3 - Math.min(0.3, (k - 0.15))})`;
  }

  // HUD
  if (MAP) {
    const me = state.players.find((p) => p.id === myId);
    const board = [...state.players].sort((a, b) => b.k - a.k || a.d - b.d);
    $('board').innerHTML = board.map((p) => `<div style="color:${p.id === myId ? '#ffd84a' : '#fff'}">${p.name} ${p.k}킬 ${p.d}데스</div>`).join('');
    for (let i = feed.length - 1; i >= 0; i--) { feed[i].t -= dt; if (feed[i].t <= 0) feed.splice(i, 1); }
    $('feed').innerHTML = feed.map((f) => `<div>${f.text}</div>`).join('');
    if (me) {
      for (const id of ['bG1', 'bG2']) {
        const cd = $(id).querySelector('.cd');
        cd.style.display = me.gCd > 0 ? 'flex' : 'none';
        cd.textContent = me.gCd.toFixed(1);
      }
      const sb = $('bSup'), pct = Math.round(me.sup * 100);
      sb.classList.toggle('ready', me.sup >= 1);
      sb.style.background = me.sup >= 1 ? 'radial-gradient(circle at 40% 35%, #ffe98a, #ff5a1f)' : `conic-gradient(#ff8a1f ${pct}%, #3a2a6a 0)`;
      // 조준 표시
      const v = views[myId];
      const B = BR[me.b];
      aimInd.visible = me.sup >= 1 && !me.dead && !!v && (aims.sup.id !== null ? !aims.sup.cancel : !isTouch);
      if (aimInd.visible) {
        if (!aimMesh) { aimMesh = new THREE.Mesh(sectorGeo(B.super.range * S, B.super.half), addMat('#ff8a1f', 0.22)); aimMesh.rotation.x = -Math.PI / 2; aimInd.add(aimMesh); }
        aimInd.position.set(v.model.root.position.x, 0.08, v.model.root.position.z);
        const a = aimAngle('sup'); if (a != null) aimInd.rotation.y = -a;
      }
      // 기본공격 조준: 정보쌤은 공격 위치가 정해져 있어서 주변 원만 표시
      atkInd.visible = !me.dead && !!v && aims.atk.id !== null && !aims.atk.cancel;
      if (atkInd.visible) {
        if (!atkMesh) {
          const r = B.attack.range * S;
          atkMesh = new THREE.Group();
          const fill = new THREE.Mesh(new THREE.CircleGeometry(r, 48), addMat('#ffe36b', 0.18)); fill.rotation.x = -Math.PI / 2;
          const edge = new THREE.Mesh(new THREE.RingGeometry(r * 0.94, r, 48), addMat('#fff3b0', 0.8)); edge.rotation.x = -Math.PI / 2; edge.position.y = 0.01;
          atkMesh.add(fill, edge); atkInd.add(atkMesh);
        }
        atkInd.position.set(v.model.root.position.x, 0.09, v.model.root.position.z);
      }
      $('dead').style.display = me.dead ? 'flex' : 'none';
      if (me.dead) $('dead').textContent = `${me.respawn}초 후 부활`;
    }
  }
  if (mode === 'lobby') { updateLobby(dt, now); renderer.render(lobbyScene, lobbyCam); }
  else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
