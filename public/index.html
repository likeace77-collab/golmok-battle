<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>정보쌤 브롤</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f4f; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  .stroke { text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 3px 0 #000; }
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #4a33a0, #140d2c); z-index: 20; }
  .card { width: min(92vw, 390px); background: linear-gradient(#2e2163, #1f1648); border: 4px solid #000; border-radius: 20px; padding: 26px 22px; box-shadow: 0 8px 0 #000; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: -1px; color: #ffd84a; font-weight: 900; }
  .sub { margin: 0 0 18px; opacity: .85; font-size: 15px; }
  label { display: block; text-align: left; font-size: 13px; margin: 10px 0 4px; opacity: .85; }
  input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 3px solid #000; background: #fff; color: #111; outline: none; }
  .btn { margin-top: 18px; width: 100%; padding: 14px; font-size: 22px; font-weight: 900; border: 4px solid #000; border-radius: 14px; background: linear-gradient(#ffe36b, #ffbf1f); color: #111; box-shadow: 0 6px 0 #000; cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
  .help { margin-top: 16px; font-size: 12.5px; line-height: 1.65; opacity: .85; text-align: left; }
  .help b { color: #ffd84a; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; }
  .nm { font-weight: 900; font-size: 14px; }
  .hpb { width: 74px; height: 12px; margin: 2px auto 0; background: #000; border-radius: 5px; padding: 2px; }
  .hpb i { display: block; height: 100%; border-radius: 3px; background: #ff4d4d; transition: width .1s; }
  .me .hpb i { background: #3ce07f; }
  .am { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
  .am i { width: 22px; height: 7px; background: #000; border-radius: 3px; overflow: hidden; position: relative; }
  .am i b { position: absolute; left: 0; top: 0; bottom: 0; background: #ffb02e; }
  .bub { display: none; margin: 0 auto 6px; background: #fff; color: #111; border: 3px solid #000; border-radius: 12px; padding: 4px 10px; font-weight: 900; font-size: 14px; position: relative; animation: pop .18s ease-out; }
  .bub:after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-top-color: #000; border-bottom: 0; }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .pp { position: absolute; transform: translate(-50%, -50%); font-weight: 900; white-space: nowrap; }

  #top { position: fixed; top: 8px; left: 8px; z-index: 6; display: none; gap: 6px; pointer-events: auto; }
  #top button { padding: 7px 10px; font-size: 13px; font-weight: 800; border: 3px solid #000; border-radius: 9px; background: #fff; cursor: pointer; }
  #board { position: fixed; top: 8px; right: 12px; z-index: 6; text-align: right; font-weight: 800; font-size: 14px; line-height: 1.5; }
  #feed { position: fixed; top: 52px; left: 0; right: 0; z-index: 6; text-align: center; font-weight: 900; font-size: 15px; color: #ff9a9a; line-height: 1.6; }
  #dead { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); font-size: 36px; font-weight: 900; }

  #ctrl { position: fixed; right: 18px; bottom: 22px; z-index: 8; display: none; width: 250px; height: 210px; }
  .cb { position: absolute; border-radius: 50%; border: 4px solid #000; font-weight: 900; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; box-shadow: 0 5px 0 #000; cursor: pointer; pointer-events: auto; }
  .cb small { font-size: 10px; opacity: .7; }
  .cb .n { position: absolute; top: -6px; right: -6px; background: #000; color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 6px; }
  .cb .cd { position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: none; align-items: center; justify-content: center; font-size: 16px; }
  #bAtk { right: 0; bottom: 0; width: 104px; height: 104px; background: radial-gradient(circle at 40% 35%, #ffe98a, #ffb31f); font-size: 15px; }
  #bG1 { right: 124px; bottom: 6px; width: 74px; height: 74px; background: radial-gradient(circle at 40% 35%, #c9f6ff, #4fd2ff); font-size: 12px; }
  #bG2 { right: 18px; bottom: 124px; width: 74px; height: 74px; background: radial-gradient(circle at 40% 35%, #d8ffd0, #63e65a); font-size: 12px; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
</head>
<body>
<div id="lobby">
  <div class="card">
    <h1 class="stroke">정보쌤 브롤</h1>
    <p class="sub">아~ 이놈의 아이들</p>
    <label>닉네임</label>
    <input id="nameIn" maxlength="10" placeholder="정보쌤">
    <label>방 코드 (친구랑 같은 코드 입력)</label>
    <input id="roomIn" maxlength="16" placeholder="lobby">
    <button class="btn" id="startBtn">입장</button>
    <div class="help">
      <b>이동</b> WASD / 방향키 · 폰은 왼쪽 화면 드래그<br>
      <b>기본공격</b> Space / 클릭 — 아~ 이놈의 아이들 (점프 내려찍기 광역)<br>
      <b>가젯1</b> Q — AI야? 시키지도 않은 걸 하네 (전기 스턴)<br>
      <b>가젯2</b> E — 마우스 소환 (적 쫓아가서 딸깍)<br>
      가젯은 판당 각 3회, 공용 쿨타임 6초
    </div>
  </div>
</div>
<div id="ui"></div>
<div id="top"><button id="botBtn">+ 봇 추가</button><button id="clearBtn">봇 삭제</button></div>
<div id="board" class="stroke"></div>
<div id="feed" class="stroke"></div>
<div id="dead" class="stroke"></div>
<div id="ctrl">
  <div class="cb" id="bAtk">공격<small>Space</small></div>
  <div class="cb" id="bG1">AI야?<small>Q</small><span class="n">3</span><span class="cd"></span></div>
  <div class="cb" id="bG2">마우스<small>E</small><span class="n">3</span><span class="cd"></span></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from 'three';

const S = 0.05;                       // 서버 px → 3D 월드 단위
const isTouch = 'ontouchstart' in window;
const $ = (id) => document.getElementById(id);

// ── 렌더러 / 씬 ───────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1f4f');
scene.fog = new THREE.Fog('#2a1f4f', 70, 140);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

scene.add(new THREE.HemisphereLight('#ffffff', '#7a5aa8', 1.15));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 90 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

let W = 1, H = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ── 공용 재질 ─────────────────────────────────────
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
const basicCache = {};
const basic = (c) => basicCache[c] || (basicCache[c] = new THREE.MeshBasicMaterial({ color: c, transparent: true }));
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// ── 맵 (컴퓨터실) ─────────────────────────────────
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const floorTex = canvasTex(256, 256, (g, w, h) => {
  const cols = ['#d9dbe8', '#c9cde0'];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = cols[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
  g.strokeStyle = 'rgba(60,60,90,.35)'; g.lineWidth = 4;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
  for (let k = 0; k < 140; k++) { g.fillStyle = `rgba(80,80,120,${Math.random() * 0.12})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
const screenTex = canvasTex(128, 96, (g) => {
  g.fillStyle = '#0b1a3a'; g.fillRect(0, 0, 128, 96);
  const cs = ['#5ee0ff', '#ffd84a', '#ff7ac6', '#7dff8a', '#ffffff'];
  for (let y = 10; y < 90; y += 9) { let x = 8 + Math.floor(Math.random() * 3) * 8; while (x < 110 && Math.random() < 0.8) { const w = 8 + Math.random() * 26; g.fillStyle = cs[Math.floor(Math.random() * cs.length)]; g.fillRect(x, y, w, 4); x += w + 5; } }
});

function buildMap(MAP) {
  const fw = MAP.w * S, fh = MAP.h * S;
  floorTex.repeat.set(fw / 6, fh / 6);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), std('#ffffff', { map: floorTex, roughness: 0.55 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(fw / 2, 0, fh / 2); floor.receiveShadow = true;
  scene.add(floor);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(fw + 200, fh + 200), std('#3a2b6e'));
  outer.rotation.x = -Math.PI / 2; outer.position.set(fw / 2, -0.02, fh / 2); outer.receiveShadow = true; scene.add(outer);
  // 외곽 벽
  const bm = std('#7b5cff', { roughness: 0.5 }), bm2 = std('#5a3fd6');
  const T = 1.2, HH = 1.3;
  for (const [x, z, w, d] of [[fw / 2, -T / 2, fw + 2 * T, T], [fw / 2, fh + T / 2, fw + 2 * T, T], [-T / 2, fh / 2, T, fh], [fw + T / 2, fh / 2, T, fh]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, HH, d), bm); b.position.set(x, HH / 2, z);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.2, d + 0.1), bm2); cap.position.set(x, HH + 0.1, z);
    scene.add(b, cap); shadowAll(b); shadowAll(cap);
  }
  // 책상 + 모니터
  const wood = std('#b07a46', { roughness: 0.55 }), woodD = std('#7a4e2b'), dark = std('#222630', { roughness: 0.4 }), key = std('#e9e9ef');
  const scr = new THREE.MeshBasicMaterial({ map: screenTex });
  for (const w of MAP.walls) {
    const cx = (w.x + w.w / 2) * S, cz = (w.y + w.h / 2) * S, sw = w.w * S, sd = w.h * S;
    const g = new THREE.Group(); g.position.set(cx, 0, cz);
    const body = new THREE.Mesh(new THREE.BoxGeometry(sw - 0.3, 1.25, sd - 0.3), woodD); body.position.y = 0.63;
    const top = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.22, sd), wood); top.position.y = 1.36;
    g.add(body, top);
    const along = sw >= sd, len = along ? sw : sd, n = Math.max(1, Math.floor(len / 2.6));
    for (let i = 0; i < n; i++) {
      const off = -len / 2 + len / n * (i + 0.5);
      const mon = new THREE.Group();
      const stand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), dark); stand.position.y = 1.7;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 0.12), dark); frame.position.y = 2.35;
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.86), scr); screen.position.set(0, 2.35, 0.065);
      const kb = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.06, 0.38), key); kb.position.set(0, 1.5, 0.55);
      mon.add(stand, frame, screen, kb);
      if (along) mon.position.x = off; else { mon.position.z = off; mon.rotation.y = Math.PI / 2; }
      g.add(mon);
    }
    shadowAll(g); scene.add(g);
  }
}

// ── 정보쌤 3D 모델 ────────────────────────────────
// 뚱뚱한 체형 · 뿔테안경 · 금목걸이 · 검은 티셔츠 · 검은 외투 · 하늘색 바지
function makeTeacher(teamColor) {
  const m = {
    skin: std('#f1c39c', { roughness: 0.6 }),
    shirt: std('#161616', { roughness: 0.95 }),
    coat: std('#0c0c10', { roughness: 0.38, metalness: 0.15, side: THREE.DoubleSide }),
    pants: std('#8fd3ff', { roughness: 0.8 }),
    shoe: std('#f4f4f4', { roughness: 0.5 }),
    sole: std('#222'),
    hair: std('#131313', { roughness: 0.8 }),
    frame: std('#2a150a', { roughness: 0.3 }),
    lens: new THREE.MeshStandardMaterial({ color: '#cdeaff', transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.3 }),
    gold: std('#ffcf3a', { metalness: 1, roughness: 0.2, emissive: '#6a4300', emissiveIntensity: 0.4 }),
    eye: std('#111'), mouth: std('#7a2a2a'),
  };
  const root = new THREE.Group();
  const model = new THREE.Group(); model.scale.setScalar(0.88); root.add(model);
  const body = new THREE.Group(); model.add(body);

  const ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 1.65, 48), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.9 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; root.add(ring);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(1.35, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; root.add(blob);

  // 다리 (하늘색 바지)
  const legs = [];
  for (const sx of [-0.45, 0.45]) {
    const hip = new THREE.Group(); hip.position.set(sx, 1.1, 0); body.add(hip);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.3, 1.0, 14), m.pants); leg.position.y = -0.5; hip.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.26, 0.72), m.shoe); shoe.position.set(0, -1.0, 0.1); hip.add(shoe);
    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.74), m.sole); sole.position.set(0, -1.12, 0.1); hip.add(sole);
    legs.push(hip);
  }
  // 몸통
  const torso = new THREE.Group(); torso.position.y = 1.0; body.add(torso);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), m.shirt);
  belly.scale.set(1.18, 1.08, 1.1); belly.position.set(0, 0.95, 0.08); torso.add(belly);
  const hipBand = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.9, 0.35, 24), m.pants); hipBand.position.y = 0.15; torso.add(hipBand);
  // 외투 (앞이 열린 검은 코트)
  const OPEN = 0.62;
  const coat = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.32, 1.9, 28, 1, true, OPEN, Math.PI * 2 - OPEN * 2), m.coat);
  coat.position.y = 0.95; torso.add(coat);
  const shoulders = new THREE.Mesh(new THREE.SphereGeometry(1.1, 28, 12, Math.PI / 2 + OPEN, Math.PI * 2 - OPEN * 2, 0, Math.PI / 2), m.coat);
  shoulders.scale.y = 0.5; shoulders.position.y = 1.9; torso.add(shoulders);
  for (const s of [-1, 1]) {
    const lapel = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.2, 0.08), m.coat);
    lapel.position.set(s * 0.62, 1.45, 0.98); lapel.rotation.set(-0.25, s * 0.55, s * 0.28); torso.add(lapel);
  }
  // 금목걸이 (두 줄 + 펜던트)
  const chain1 = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.07, 10, 40), m.gold);
  chain1.position.set(0, 1.78, 0.42); chain1.rotation.x = 1.15; torso.add(chain1);
  const chain2 = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.055, 10, 40), m.gold);
  chain2.position.set(0, 1.62, 0.5); chain2.rotation.x = 1.0; torso.add(chain2);
  const pend = new THREE.Mesh(new THREE.OctahedronGeometry(0.17), m.gold);
  pend.position.set(0, 1.12, 1.08); pend.scale.set(1, 1.3, 0.6); torso.add(pend);
  // 팔 (외투 소매)
  const arms = [];
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 1.15, 1.75, 0); torso.add(sh);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 1.1, 14), m.coat); sleeve.position.y = -0.55; sh.add(sleeve);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 10), m.skin); hand.position.y = -1.18; sh.add(hand);
    sh.rotation.z = s * 0.32; sh.userData.baseZ = s * 0.32;
    arms.push(sh);
  }
  // 머리
  const head = new THREE.Group(); head.position.y = 2.55; torso.add(head);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.72, 26, 20), m.skin); face.scale.set(1.08, 1, 1); head.add(face);
  const chin = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 14), m.skin); chin.position.set(0, -0.42, 0.2); chin.scale.set(1.25, 0.75, 1); head.add(chin);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.76, 26, 14, 0, Math.PI * 2, 0, Math.PI / 2.3), m.hair);
  hair.position.y = 0.06; hair.scale.set(1.08, 0.95, 1.05); hair.rotation.x = -0.25; head.add(hair);
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), m.skin); ear.position.set(s * 0.78, 0, -0.02); head.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), m.eye); eye.position.set(s * 0.27, 0.08, 0.66); head.add(eye);
    // 뿔테
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.065, 10, 26), m.frame); rim.position.set(s * 0.28, 0.08, 0.72); rim.scale.set(1.15, 0.9, 1); head.add(rim);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.19, 20), m.lens); lens.position.set(s * 0.28, 0.08, 0.73); lens.scale.set(1.15, 0.9, 1); head.add(lens);
    const temple = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.75), m.frame); temple.position.set(s * 0.72, 0.12, 0.38); temple.rotation.y = s * 0.12; head.add(temple);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 0.1), m.frame); brow.position.set(s * 0.28, 0.27, 0.74); head.add(brow);
  }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.06), m.frame); bridge.position.set(0, 0.12, 0.76); head.add(bridge);
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 6, 16, Math.PI), m.mouth); mouth.position.set(0, -0.2, 0.7); mouth.rotation.z = Math.PI; head.add(mouth);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), m.skin); nose.position.set(0, -0.04, 0.74); head.add(nose);

  // 스턴 별
  const stars = new THREE.Group(); stars.position.y = 4.4; model.add(stars); stars.visible = false;
  for (let i = 0; i < 4; i++) {
    const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.22), new THREE.MeshBasicMaterial({ color: '#ffe23a' }));
    st.position.set(Math.cos(i * Math.PI / 2) * 0.9, 0, Math.sin(i * Math.PI / 2) * 0.9); stars.add(st);
  }
  shadowAll(model);
  ring.castShadow = blob.castShadow = false;
  return { root, model, body, torso, head, legs, arms, stars, flashMats: [m.skin, m.shirt, m.coat, m.pants] };
}

// ── 마우스(소환수) 3D ──────────────────────────────
function makeMouse(color) {
  const g = new THREE.Group();
  const inner = new THREE.Group(); g.add(inner);
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), std('#f2f2f6', { roughness: 0.3 }));
  shell.scale.set(0.85, 0.6, 1.25); shell.position.y = 0.32; inner.add(shell);
  const split = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.55), std('#222')); split.position.set(0, 0.62, 0.3); inner.add(split);
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.08, 12), std('#333')); wheel.rotation.z = Math.PI / 2; wheel.position.set(0, 0.64, 0.32); inner.add(wheel);
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.08), new THREE.MeshBasicMaterial({ color })); led.position.set(0, 0.3, -0.6); inner.add(led);
  for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), std('#111')); eye.position.set(s * 0.17, 0.5, 0.55); inner.add(eye); }
  const cable = [];

// ── 파티클 / 이펙트 ───────────────────────────────
const pGeo = new THREE.BoxGeometry(1, 1, 1);
const parts = [];
function burst(x, y, z, n, colors, { speed = 8, size = 0.2, up = 6, life = 0.8, grav = 18 } = {}) {
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(pGeo, basic(colors[i % colors.length]));
    const s0 = size * (0.5 + Math.random());
    mesh.scale.setScalar(s0); mesh.position.set(x, y, z);
    mesh.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    const a = Math.random() * Math.PI * 2, sp = speed * (0.35 + Math.random() * 0.65);
    parts.push({ mesh, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp, vy: up * (0.4 + Math.random()), t: 0, life: life * (0.6 + Math.random() * 0.6), s0, grav });
    scene.add(mesh);
  }
  while (parts.length > 500) scene.remove(parts.shift().mesh);
}
const effects = [];
function addFx(dur, obj, upd, delay = 0) {
  if (obj) { obj.visible = delay <= 0; scene.add(obj); }
  effects.push({ dur, obj, upd, t: -delay });
}
const later = (delay, fn) => effects.push({ dur: 0.0001, t: -delay, once: fn });
function addMat(c, op = 1, add = false) { return new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, side: THREE.DoubleSide, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false }); }

let shake = 0;

function fxSlam(x, z, r, color, near) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.88, 1, 64), addMat(color));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, 0.12, z);
  addFx(0.45, ring, (k) => { ring.scale.setScalar(r * (0.25 + 0.75 * Math.pow(k, 0.5))); ring.material.opacity = 1 - k; });
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.7, 1, 64), addMat('#ffffff'));
  ring2.rotation.x = -Math.PI / 2; ring2.position.set(x, 0.14, z);
  addFx(0.3, ring2, (k) => { ring2.scale.setScalar(r * (0.1 + 0.9 * k)); ring2.material.opacity = 0.7 * (1 - k); });
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 48), addMat(color, 0.5));
  disc.rotation.x = -Math.PI / 2; disc.position.set(x, 0.1, z);

  const wave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.16, 8, 64), addMat('#fff3b0'));

}

function lightning(from, to) {
  const N = 9, pos = new Float32Array(N * 3);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: '#bff6ff', transparent: true, blending: THREE.AdditiveBlending }));
  addFx(0.55, line, (k) => {
    const a = from(), b = to();
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), j = i === 0 || i === N - 1 ? 0 : 0.7;
      pos[i * 3] = a.x + (b.x - a.x) * t + (Math.random() - 0.5) * j;
      pos[i * 3 + 1] = 2.4 + (Math.random() - 0.5) * j;
      pos[i * 3 + 2] = a.z + (b.z - a.z) * t + (Math.random() - 0.5) * j;
    }
    geo.attributes.position.needsUpdate = true;
    line.material.opacity = Math.random() < 0.3 ? 0.2 : 1 - k * 0.6;
  });
}

function fxStun(x, z, r, casterId, hits, near) {

  const fill = new THREE.Mesh(new THREE.CircleGeometry(1, 48), addMat('#3fd0ff', 0.3));
  fill.rotation.x = -Math.PI / 2; fill.position.set(x, 0.1, z);

function makeLabel(mine) {
  const d = document.createElement('div'); d.className = 'lbl' + (mine ? ' me' : '');
  d.innerHTML = '<div class="bub"></div><div class="nm stroke"></div><div class="hpb"><i></i></div>' + (mine ? '<div class="am"><i><b></b></i><i><b></b></i><i><b></b></i></div>' : '');
  ui.appendChild(d);
  return { d, bub: d.querySelector('.bub'), nm: d.querySelector('.nm'), hp: d.querySelector('.hpb i'), am: [...d.querySelectorAll('.am b')], lastSay: null };
}
function getView(p) {
  let v = views[p.id];
  if (!v) {
    const model = makeTeacher(p.color);
    model.root.position.set(p.x * S, 0, p.y * S);
    scene.add(model.root);
    v = views[p.id] = { model, label: makeLabel(p.id === myId), facing: 0, phase: 0, speed: 0, atkT: 9, g1T: 9, g2T: 9, hitT: 9, deadT: 0, lastHp: p.hp, dead: p.dead };
  }
  return v;
}
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }
const ease = (t) => 1 - Math.pow(1 - t, 3);

function animateTeacher(v, p, dt, now) {
  const M = v.model, root = M.root;
  const tx = p.x * S, tz = p.y * S;
  const ox = root.position.x, oz = root.position.z;
  if (Math.hypot(tx - ox, tz - oz) > 10) root.position.set(tx, 0, tz);
  const k = Math.min(1, dt * 14);
  root.position.x += (tx - root.position.x) * k;
  root.position.z += (tz - root.position.z) * k;
  const mdx = root.position.x - ox, mdz = root.position.z - oz;
  const sp = Math.hypot(mdx, mdz) / Math.max(dt, 1e-3);
  v.speed += (sp - v.speed) * Math.min(1, dt * 10);
  if (sp > 0.8) v.facing = lerpAngle(v.facing, Math.atan2(mdx, mdz), Math.min(1, dt * 14));
  root.rotation.y = v.facing;

  // 피격 / 사망 / 부활
  if (p.hp < v.lastHp - 1 && !p.dead) v.hitT = 0;
  v.lastHp = p.hp;
  if (p.dead && !v.dead) { v.deadT = 0; burst(root.position.x, 2, root.position.z, 40, ['#111', '#8fd3ff', '#ffcf3a', '#f1c39c', '#777'], { speed: 9, size: 0.3, up: 10, life: 1.1 }); if (p.id === myId) shake = 0.6; }
  if (!p.dead && v.dead) fxSpawn(root.position.x, root.position.z);
  v.dead = p.dead;

  v.atkT += dt; v.g1T += dt; v.g2T += dt; v.hitT += dt; v.deadT += dt;
  const walk = Math.min(1, v.speed / 8);
  v.phase += dt * (6 + v.speed * 0.9);
  const s = Math.sin(v.phase);

  // 기본 포즈 + 걷기
  M.legs[0].rotation.x = s * 0.75 * walk;
  M.legs[1].rotation.x = -s * 0.75 * walk;
  let armX = [-s * 0.6 * walk, s * 0.6 * walk], armZ = [M.arms[0].userData.baseZ, M.arms[1].userData.baseZ];
  let bodyY = Math.abs(s) * 0.22 * walk, sx = 1, sy = 1 + Math.sin(now * 2.2) * 0.025, spin = 0, lean = walk * 0.12;
  M.torso.rotation.z = Math.sin(v.phase) * 0.07 * walk;
  M.head.rotation.y = 0;

  // 기본공격: 두 팔 번쩍 → 점프 → 내려찍기
  if (v.atkT < 0.55) {
    const t = v.atkT;
    if (t < 0.11) { const q = ease(t / 0.11); armX = [-2.9 * q, -2.9 * q]; armZ = [-0.2, 0.2]; bodyY += 1.1 * q; sy = 1 + 0.15 * q; sx = 1 - 0.08 * q; }
    else if (t < 0.2) { const q = (t - 0.11) / 0.09; armX = [-2.9 + 2.2 * q, -2.9 + 2.2 * q]; bodyY += 1.1 * (1 - q); sy = 1 + 0.15 - 0.4 * q; sx = 1 + 0.2 * q; lean = 0.35 * q; }
    else { const q = ease((t - 0.2) / 0.35); armX = [-0.7 * (1 - q), -0.7 * (1 - q)]; sy = 0.75 + 0.25 * q + Math.sin(q * 14) * 0.06 * (1 - q); sx = 1.2 - 0.2 * q; lean = 0.35 * (1 - q); }
    M.head.rotation.y = Math.sin(now * 40) * 0.12 * Math.max(0, 1 - t * 2);
  }
  // 가젯1: 손가락질 + 뒤로 젖히기
  if (v.g1T < 0.7) {
    const q = v.g1T < 0.1 ? v.g1T / 0.1 : 1 - Math.max(0, v.g1T - 0.5) / 0.2;
    armX[1] = -1.6 * q; armZ[1] = 0.1;
    armX[0] = -0.3 * q; armZ[0] = -0.9 * q;
    lean = -0.25 * q; M.head.rotation.y = Math.sin(now * 30) * 0.15 * q;
  }
  // 가젯2: 팔 벌리고 한 바퀴
  if (v.g2T < 0.7) {
    const t = v.g2T, q = t < 0.1 ? t / 0.1 : 1 - Math.max(0, t - 0.5) / 0.2;
    armZ = [-2.3 * q, 2.3 * q]; armX = [0, 0];
    spin = ease(Math.min(1, t / 0.45)) * Math.PI * 2; bodyY += Math.sin(Math.min(1, t / 0.45) * Math.PI) * 0.8;
  }
  M.arms[0].rotation.x = armX[0]; M.arms[1].rotation.x = armX[1];
  M.arms[0].rotation.z = armZ[0]; M.arms[1].rotation.z = armZ[1];
  M.body.position.y = bodyY;
  M.body.scale.set(sx, sy, sx);
  M.body.rotation.x = lean;
  M.body.rotation.y = spin;

  // 피격 반짝
  const fl = v.hitT < 0.2 ? (1 - v.hitT / 0.2) : 0;
  for (const m of M.flashMats) { m.emissive.setRGB(fl, fl * 0.3, fl * 0.3); }
  if (v.hitT < 0.15) M.model.position.x = (Math.random() - 0.5) * 0.25; else M.model.position.x = 0;

  // 스턴
  M.stars.visible = p.stun && !p.dead;
  if (M.stars.visible) { M.stars.rotation.y = now * 5; M.body.rotation.z = Math.sin(now * 8) * 0.12; } else M.body.rotation.z = 0;

  // 사망 연출
  if (p.dead) {
    const q = Math.min(1, v.deadT / 0.35);
    M.model.rotation.x = -q * Math.PI / 2; M.model.position.y = -q * 0.5;
    M.model.visible = v.deadT < 1.2;
  } else { M.model.rotation.x = 0; M.model.position.y = 0; M.model.visible = true; }
}

function updateLabel(v, p) {
  const L = v.label, pos = v.model.root.position;
  const [x, y, vis] = toScreen(pos.x, 5.0 + v.model.body.position.y * 0.5, pos.z);
  L.d.style.display = p.dead || !vis ? 'none' : 'block';
  L.d.style.left = x + 'px'; L.d.style.top = y + 'px';
  L.nm.textContent = `${p.name}  ${p.hp}`;
  L.hp.style.width = (100 * p.hp / ST.maxHp) + '%';
  L.am.forEach((b, i) => { const f = Math.max(0, Math.min(1, p.ammo - i)); b.style.width = f * 100 + '%'; b.style.background = f >= 1 ? '#ffb02e' : '#8a6a32'; });
  if (p.say !== L.lastSay) { L.lastSay = p.say; if (p.say) { L.bub.textContent = p.say; L.bub.style.display = 'block'; L.bub.style.animation = 'none'; L.bub.offsetWidth; L.bub.style.animation = ''; } else L.bub.style.display = 'none'; }
}

function animateMouse(mv, m, dt, now) {
  const tx = m.x * S, tz = m.y * S, g = mv.obj.g;
  const k = Math.min(1, dt * 14);
  g.position.x += (tx - g.position.x) * k; g.position.z += (tz - g.position.z) * k;
  g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(Math.cos(m.a), Math.sin(m.a)), Math.min(1, dt * 12));
  mv.obj.inner.position.y = Math.abs(Math.sin(now * 18 + mv.seed)) * 0.25;
  mv.obj.inner.rotation.z = Math.sin(now * 18 + mv.seed) * 0.15;
  mv.obj.wheel.rotation.x = now * 20;
  mv.obj.cable.forEach((c, i) => { const t = i + 1; c.position.set(Math.sin(now * 14 - t * 0.9 + mv.seed) * 0.12 * t * 0.5, 0.18, -0.55 - t * 0.17); });
}

// ── 메인 루프 ────────────────────────────────────
const camTarget = new THREE.Vector3(40, 0, 30);
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  const now = nowMs / 1000;
  if (MAP) {
    const alive = new Set();
    for (const p of state.players) { const v = getView(p); alive.add(p.id); animateTeacher(v, p, dt, now); updateLabel(v, p); }
    for (const id in views) if (!alive.has(id)) { scene.remove(views[id].model.root); views[id].label.d.remove(); delete views[id]; }
    const malive = new Set();
    for (const m of state.mice) {
      let mv = mviews[m.id];
      if (!mv) { const obj = makeMouse(m.c); obj.g.position.set(m.x * S, 0, m.y * S); scene.add(obj.g); mv = mviews[m.id] = { obj, seed: Math.random() * 10 }; }
      malive.add(String(m.id)); animateMouse(mv, m, dt, now);
    }
    for (const id in mviews) if (!malive.has(id)) { const g = mviews[id].obj.g; burst(g.position.x, 0.5, g.position.z, 10, ['#f2f2f6', '#7dff8a'], { speed: 4, size: 0.12, up: 5, life: 0.5 }); scene.remove(g); delete mviews[id]; }

    // 카메라 (브롤스타즈처럼 비스듬히 위에서)
    const mp = myPos();
    if (mp) camTarget.lerp(mp, Math.min(1, dt * 6));
    const far = camera.aspect < 1 ? 1.75 : 1;
    camera.position.set(camTarget.x, 20 * far, camTarget.z + 20 * far);
    if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 2.2); }
    camera.lookAt(camTarget.x, 1.2, camTarget.z + 1);
    sun.position.set(camTarget.x + 12, 30, camTarget.z + 10); sun.target.position.copy(camTarget);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    if (e.t < 0) continue;
    if (e.once) { e.once(); effects.splice(i, 1); continue; }
    if (e.obj) e.obj.visible = true;
    const k = e.t / e.dur;
    if (k >= 1) { if (e.obj) scene.remove(e.obj); effects.splice(i, 1); }
    else e.upd(k, e);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t >= p.life) { scene.remove(p.mesh); parts.splice(i, 1); continue; }
    p.vy -= p.grav * dt;
    p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
    if (p.mesh.position.y < 0.08) { p.mesh.position.y = 0.08; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
    p.mesh.rotation.x += dt * 8; p.mesh.rotation.y += dt * 6;
    p.mesh.scale.setScalar(p.s0 * (1 - p.t / p.life));
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt; const k = p.t / p.dur;
    if (k >= 1) { p.d.remove(); pops.splice(i, 1); continue; }
    const [x, y] = toScreen(p.x, p.y + k * 1.5, p.z);
    p.d.style.left = x + 'px'; p.d.style.top = y + 'px';
    p.d.style.opacity = k > 0.6 ? (1 - k) / 0.4 : 1;
    p.d.style.transform = `translate(-50%,-50%) scale(${k < 0.15 ? 0.5 + k / 0.15 * 0.8 : 1.3 - Math.min(0.3, (k - 0.15))})`;
  }

  // HUD
  if (MAP) {
    const me = state.players.find((p) => p.id === myId);
    const board = [...state.players].sort((a, b) => b.k - a.k || a.d - b.d);
    $('board').innerHTML = board.map((p) => `<div style="color:${p.id === myId ? '#ffd84a' : '#fff'}">${p.name} ${p.k}킬 ${p.d}데스</div>`).join('');
    for (let i = feed.length - 1; i >= 0; i--) { feed[i].t -= dt; if (feed[i].t <= 0) feed.splice(i, 1); }
    $('feed').innerHTML = feed.map((f) => `<div>${f.text}</div>`).join('');
    if (me) {
      for (const [id, uses] of [['bG1', me.g1], ['bG2', me.g2]]) {
        const b = $(id); b.querySelector('.n').textContent = uses;
        const cd = b.querySelector('.cd');
        cd.style.display = me.gCd > 0 || uses <= 0 ? 'flex' : 'none';
        cd.textContent = uses <= 0 ? '✕' : me.gCd.toFixed(1);
      }
      $('dead').style.display = me.dead ? 'flex' : 'none';
      if (me.dead) $('dead').textContent = `${me.respawn}초 후 부활`;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
