  if (M.stars.visible) { M.stars.rotation.y = now * 5; M.body.rotation.z = Math.sin(now * 8) * 0.12; } else M.body.rotation.z = 0;

  // 사망 연출
  if (p.dead) {
    const q = Math.min(1, v.deadT / 0.35);
    M.model.rotation.x = -q * Math.PI / 2; M.model.position.y = -q * 0.5;
    M.model.visible = v.deadT < 1.2;
  } else { M.model.rotation.x = 0; M.model.position.y = 0; M.model.visible = true; }
}

function updateLabel(v, p) {
  const L = v.label, pos = v.model.root.position;
  const [x, y, vis] = toScreen(pos.x, 5.0 + v.model.body.position.y * 0.5, pos.z);
  L.d.style.display = p.dead || p.out || !vis ? 'none' : 'block';
  L.d.style.left = x + 'px'; L.d.style.top = y + 'px';
  L.nm.textContent = `${p.scared > 0 ? '😰 ' : ''}${p.aw ? '🔥 ' : ''}${p.ctl ? '🎮 ' : ''}${p.gems ? '💎' + p.gems + ' ' : ''}${p.name}  ${p.hp}${p.sh > 0 ? ' 🛡' + p.sh : ''}`;
  const meP = state.players.find((q) => q.id === myId);
  L.d.classList.toggle('ally', p.id !== myId && p.team != null && meP && meP.team === p.team);
  L.rfb.style.display = p.rf > 0 ? 'block' : 'none'; L.rf.style.width = p.rf * 100 + '%';
  // 김준후 쫄 게이지 (공격 불능 중엔 남은 시간만큼)
  const hasFear = BR[p.b] && BR[p.b].trait;
  L.fb.style.display = hasFear ? 'block' : 'none';
  if (hasFear) { const sc = p.scared > 0; L.fb.classList.toggle('scared', sc); L.fear.style.width = (sc ? p.scared / BR[p.b].trait.dur : p.fear) * 100 + '%'; }
  L.hp.style.width = (100 * p.hp / (BR[p.b] ? BR[p.b].maxHp : p.hp || 1)) + '%';
  L.am.forEach((b, i) => { const f = Math.max(0, Math.min(1, p.ammo - i)); b.style.width = f * 100 + '%'; b.style.background = f >= 1 ? '#ffb02e' : '#8a6a32'; });
  if (p.say !== L.lastSay) { L.lastSay = p.say; if (p.say) { L.bub.textContent = p.say; L.bub.style.display = 'block'; L.bub.style.animation = 'none'; L.bub.offsetWidth; L.bub.style.animation = ''; } else L.bub.style.display = 'none'; }
}

function animateMouse(mv, m, dt, now) {
  const tx = m.x * S, tz = m.y * S, g = mv.obj.g;
  const k = Math.min(1, dt * 14);
  g.position.x += (tx - g.position.x) * k; g.position.z += (tz - g.position.z) * k;
  g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(Math.cos(m.a), Math.sin(m.a)), Math.min(1, dt * 12));
  mv.obj.inner.position.y = Math.abs(Math.sin(now * 18 + mv.seed)) * 0.25;
  mv.obj.inner.rotation.z = Math.sin(now * 18 + mv.seed) * 0.15;
  mv.obj.wheel.rotation.x = now * 20;
  mv.obj.cable.forEach((c, i) => { const t = i + 1; c.position.set(Math.sin(now * 14 - t * 0.9 + mv.seed) * 0.12 * t * 0.5, 0.18, -0.55 - t * 0.17); });
}

// ── 모드 HUD / 라운드 결과 ────────────────────────
let lastResultKey = null;
const fmtT = (t) => `${Math.floor(t / 60)}:${String(Math.max(0, t) % 60).padStart(2, '0')}`;
function modeHud(me) {
  const M = META.modes[state.mode]; if (!M) return;
  const h = $('modeHud'), pm = $('phaseMsg');
  if (M.id === 'gem') {
    const [a, b] = state.score || [0, 0], my = me ? me.team : 0;
    const L = my === 0 ? a : b, Rr = my === 0 ? b : a;
    let hold = '';
    if (state.hold) hold = `<div style="font-size:26px;color:${state.hold.team === my ? '#7cc8ff' : '#ff7a7a'}">${state.hold.team === my ? '우리 팀' : '상대 팀'} 승리까지 ${Math.ceil(state.hold.t)}초!</div>`;
    h.innerHTML = `<div class="gs"><span style="color:#7cc8ff">💎 ${L}</span><span style="font-size:14px">${fmtT(Math.max(0, M.timeLimit - state.playT))}</span><span style="color:#ff7a7a">${Rr} 💎</span></div>${hold}`;
  } else if (M.id === 'showdown') {
    const alive = state.players.filter((p) => !p.out).length;
    h.innerHTML = `<div class="gs">💀 남은 인원 ${alive}</div>` + (me && me.out && state.phase === 'play' ? `<div style="color:#ff9a9a">${me.rank ? me.rank + '등으로 탈락! ' : ''}관전 중...</div>` : '');
  } else {
    h.innerHTML = `<div class="gs" style="font-size:15px">${M.icon} ${M.name} · ${MAP ? MAP.name : ''} · 맵 변경 ${fmtT(state.mapT || 0)}</div>`;
  }
  // 대기 카운트다운 / 결과
  if (state.phase === 'wait') { pm.style.display = 'block'; pm.innerHTML = `${Math.ceil(state.phaseT)}<small>${MAP ? MAP.name : ''} · ${M.name}</small>`; pm.style.color = '#ffd84a'; }
  else if (state.phase === 'end' && state.result && me) {
    const r = state.result; let txt = '', col = '#fff', win = false;
    if (r.type === 'gem') { win = r.winTeam === me.team; txt = r.winTeam < 0 ? '무승부' : win ? '승리!' : '패배...'; col = r.winTeam < 0 ? '#fff' : win ? '#ffd84a' : '#ff7a7a'; }
    else { const mine = r.ranks.find((x) => x.id === myId); const rk = mine ? mine.rank : 0; win = rk === 1; txt = rk ? `${rk}등!` : '관전'; col = rk === 1 ? '#ffd84a' : rk && rk <= 3 ? '#7cffb0' : '#fff'; }
    pm.style.display = 'block'; pm.style.color = col;
    pm.innerHTML = `${txt}<small>${r.type === 'showdown' && r.winnerName ? '🏆 ' + r.winnerName + ' 우승 · ' : ''}${win && account ? '트로피 +8 · ' : ''}${Math.ceil(state.phaseT)}초 뒤 다음 판</small>`;
    const key = JSON.stringify(r) + state.map;
    lastResultKey = key;
  } else pm.style.display = 'none';
}

// ── 메인 루프 ────────────────────────────────────
const camTarget = new THREE.Vector3(40, 0, 30);
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  const now = nowMs / 1000;
  if (MAP) {
    const alive = new Set();
    for (const p of state.players) { const v = getView(p); alive.add(p.id); animateTeacher(v, p, dt, now); updateLabel(v, p); }
    for (const id in views) if (!alive.has(id)) { scene.remove(views[id].model.root); views[id].label.d.remove(); delete views[id]; }
    const malive = new Set();
    for (const m of state.mice) {
      let mv = mviews[m.id];
      if (!mv) { const obj = makeMouse(m.c); obj.g.position.set(m.x * S, 0, m.y * S); scene.add(obj.g); mv = mviews[m.id] = { obj, seed: Math.random() * 10 }; }
      malive.add(String(m.id)); animateMouse(mv, m, dt, now);
    }
    for (const id in mviews) if (!malive.has(id)) { const g = mviews[id].obj.g; burst(g.position.x, 0.5, g.position.z, 10, ['#f2f2f6', '#7dff8a'], { speed: 4, size: 0.12, up: 5, life: 0.5 }); scene.remove(g); delete mviews[id]; }

    updateStrings(now);
    // 카메라 (브롤스타즈처럼 비스듬히 위에서) — 조종 중이면 꼭두각시를 따라감
    const meS = state.players.find((p) => p.id === myId);
    let mp = meS && meS.ctrl && views[meS.ctrl] ? views[meS.ctrl].model.root.position : myPos();
    if (meS && meS.out) { const al = state.players.find((p) => !p.out && !p.dead && views[p.id]); if (al) mp = views[al.id].model.root.position; }
    updateWorld(now);
    if (mp) camTarget.lerp(mp, Math.min(1, dt * 6));
    const far = camera.aspect < 1 ? 1.75 : 1;
    camera.position.set(camTarget.x, 20 * far, camTarget.z + 20 * far);
    if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 2.2); }
    camera.lookAt(camTarget.x, 1.2, camTarget.z + 1);
    sun.position.set(camTarget.x + 12, 30, camTarget.z + 10); sun.target.position.copy(camTarget);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    if (e.t < 0) continue;
    if (e.once) { e.once(); effects.splice(i, 1); continue; }
    if (e.obj) e.obj.visible = true;
    const k = e.t / e.dur;
    if (k >= 1) { if (e.obj) scene.remove(e.obj); effects.splice(i, 1); }
    else e.upd(k, e);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    if (p.t >= p.life) { scene.remove(p.mesh); parts.splice(i, 1); continue; }
    p.vy -= p.grav * dt;
    p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
    if (p.mesh.position.y < 0.08) { p.mesh.position.y = 0.08; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
    p.mesh.rotation.x += dt * 8; p.mesh.rotation.y += dt * 6;
    p.mesh.scale.setScalar(p.s0 * (1 - p.t / p.life));
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt; const k = p.t / p.dur;
    if (k >= 1) { p.d.remove(); pops.splice(i, 1); continue; }
    const [x, y] = toScreen(p.x, p.y + k * 1.5, p.z);
    p.d.style.left = x + 'px'; p.d.style.top = y + 'px';
    p.d.style.opacity = k > 0.6 ? (1 - k) / 0.4 : 1;
    p.d.style.transform = `translate(-50%,-50%) scale(${k < 0.15 ? 0.5 + k / 0.15 * 0.8 : 1.3 - Math.min(0.3, (k - 0.15))})`;
  }

  // HUD
  if (MAP) {
    const me = state.players.find((p) => p.id === myId);
    const board = [...state.players].sort((a, b) => b.k - a.k || a.d - b.d);
    $('board').innerHTML = board.slice(0, W <= 720 ? 5 : 10).map((p) => `<div style="color:${p.id === myId ? '#ffd84a' : '#fff'}">${p.name} ${p.k}킬 ${p.d}데스</div>`).join('');
    for (let i = feed.length - 1; i >= 0; i--) { feed[i].t -= dt; if (feed[i].t <= 0) feed.splice(i, 1); }
    $('feed').innerHTML = feed.map((f) => `<div>${f.text}</div>`).join('');
    if (me) {
      const src = atkSrc() || me;            // 조종 중이면 꼭두각시의 스킬 상태를 보여줌
      for (const [i, id] of [[0, 'bG1'], [1, 'bG2']]) {
        const idx = (src.g || [0])[i];
        $(id).style.display = idx == null ? 'none' : 'flex';
        if (idx == null) continue;
        const cd = $(id).querySelector('.cd');
        cd.style.display = src.gCd > 0 ? 'flex' : 'none';
        cd.textContent = src.gCd.toFixed(1);
        $(id).querySelector('.gi').textContent = BR[src.b].gadgets[idx].icon;
        $(id).classList.toggle('puppet', src !== me);
      }
      $('bAtk').classList.toggle('puppet', src !== me);
      const B = BR[src.b];
      const sb = $('bSup'), pct = Math.round(src.sup * 100);
      sb.classList.toggle('off', !B.super);
      if (!B.super) { sb.classList.remove('ready'); } else
      { sb.classList.toggle('ready', src.sup >= 1);
      sb.style.background = src.sup >= 1 ? 'radial-gradient(circle at 40% 35%, #ffe98a, #ff5a1f)' : `conic-gradient(#ff8a1f ${pct}%, #3a2a6a 0)`; }
      // 조준 표시
      const v = views[src.id];
      if (aimInd.userData.b !== src.b) { if (aimMesh) aimInd.remove(aimMesh); aimMesh = null; aimInd.userData.b = src.b; }
      if (atkInd.userData.b !== src.b) { if (atkMesh) atkInd.remove(atkMesh); atkMesh = null; atkInd.userData.b = src.b; }
      aimInd.visible = !!B.super && src.sup >= 1 && !src.dead && !!v && (aims.sup.id !== null ? !aims.sup.cancel : !isTouch);
      if (aimInd.visible) {
        if (!aimMesh) {
          let g;
          if (B.super.aim === 'line') { g = new THREE.PlaneGeometry(B.super.range * S, B.super.width * 2 * S); g.translate(B.super.range * S / 2, 0, 0); }
          else g = sectorGeo(B.super.range * S, B.super.half);
          aimMesh = new THREE.Mesh(g, addMat(B.super.aim === 'line' ? '#d36bff' : '#ff8a1f', 0.25)); aimMesh.rotation.x = -Math.PI / 2; aimInd.add(aimMesh);
        }
        aimInd.position.set(v.model.root.position.x, 0.08, v.model.root.position.z);
        const a = aimAngle('sup'); if (a != null) aimInd.rotation.y = -a;
      }
      // 기본공격 조준: 범위 고정(정보쌤) → 주변 원 / 방향 공격(현실쌤) → 부채꼴
      const dirAtk = B.attack.aim === 'dir';
      atkInd.visible = !src.dead && !!v && (aims.atk.id !== null ? !aims.atk.cancel : (dirAtk && !isTouch));
      if (atkInd.visible) {
        if (!atkMesh) {
          const r = B.attack.range * S;
          atkMesh = new THREE.Group();
          const fill = new THREE.Mesh(dirAtk ? sectorGeo(r, B.attack.half) : new THREE.CircleGeometry(r, 48), addMat('#ffe36b', dirAtk ? 0.22 : 0.18)); fill.rotation.x = -Math.PI / 2;
          atkMesh.add(fill);
          if (!dirAtk) { const edge = new THREE.Mesh(new THREE.RingGeometry(r * 0.94, r, 48), addMat('#fff3b0', 0.8)); edge.rotation.x = -Math.PI / 2; edge.position.y = 0.01; atkMesh.add(edge); }
          atkInd.add(atkMesh);
        }
        atkInd.position.set(v.model.root.position.x, 0.09, v.model.root.position.z);
        atkMesh.scale.setScalar((src.aw ? 2 : 1) * (src.jj ? 0.85 : 1));
        if (dirAtk) { const a = aimAngle('atk'); if (a != null) atkInd.rotation.y = -a; }
      }
      const cm = $('ctrlMsg');
      if (me.ctl) { cm.style.display = 'block'; cm.textContent = '🎮 조종당하는 중!'; }
      else if (me.ctrl) { const t = state.players.find((q) => q.id === me.ctrl); cm.style.display = 'block'; cm.textContent = `🎮 ${t ? t.name : ''} 조종 중 ${me.ctrlT.toFixed(1)}초 — 이동·공격·가젯·궁극기 전부 상대 걸로!`; }
      else cm.style.display = 'none';
      $('ctrlFlash').style.opacity = me.ctl ? 1 : 0;
      const showDead = me.dead && !me.out && state.phase === 'play';
      $('dead').style.display = showDead ? 'flex' : 'none';
      if (showDead) $('dead').textContent = `${me.respawn}초 후 부활`;
    }
    modeHud(me);
  }
  if (mode === 'lobby') { updateLobby(dt, now); renderer.render(lobbyScene, lobbyCam); }
  else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
