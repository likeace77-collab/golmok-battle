# 골목대전 안드로이드 앱(APK)을 만들어서 Releases의 「app-latest」에 올립니다.
# 받는 주소: https://github.com/likeace77-collab/golmok-battle/releases/download/app-latest/golmok.apk
name: Android APK
on:
  push:
    branches: [champions]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APK 만들기
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk golmok.apk
      - uses: actions/upload-artifact@v4
        with: { name: golmok-apk, path: golmok.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 골목대전 안드로이드 앱
          body: |
            골목대전 안드로이드 앱이에요. 휴대폰에서 golmok.apk를 받아 설치하세요.
            (처음 설치할 때 「출처를 알 수 없는 앱 설치」를 허용해야 할 수 있어요.)
          files: golmok.apk
          make_latest: true
